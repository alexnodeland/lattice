version: 2
updates:
  # The images pinned in compose.yaml (tags, and digests where a registry
  # publishes only `latest`).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The plain PostgreSQL adapter runs the major version local Supabase
      # runs (supabase/config.toml's db.major_version); both move together,
      # by hand (ADR-0009).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  # The development tools in uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      tools:
        patterns: ["*"]
