# stackr on a single host, behind Caddy (RFC-0004): an overlay on compose.yaml, which `make`
# adds when STACKR_RECIPE=host. Run it with the postgres adapter and the auth profile.
#
# Only Caddy may publish on a public interface, on 80 and 443, at STACKR_EDGE_BIND: 127.0.0.1
# unless deploy/host/bootstrap sets 0.0.0.0 on a real host, so a run on a workstation opens no
# port. The admin UIs (Grafana, Langfuse, LiteLLM's, MinIO's console) are pinned to 127.0.0.1,
# whatever STACKR_BIND says, for SSH tunnels; the rest publish nothing. Docker's own iptables
# rules bypass ufw, which is why nothing else may bind a public interface.

name: stackr

services:
  # The edge: certificates from Let's Encrypt (CADDY_TLS empty), or from Caddy's own local CA
  # (CADDY_TLS="tls internal", as CI runs it). deploy/host/Caddyfile routes the hosts.
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      STACKR_DOMAIN: ${STACKR_DOMAIN:?set STACKR_DOMAIN in .env}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./deploy/host/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - ${STACKR_EDGE_BIND:-127.0.0.1}:80:80
      - ${STACKR_EDGE_BIND:-127.0.0.1}:443:443
    networks:
      default:
        # The stack's containers reach the public names at the edge too.
        aliases:
          - app.${STACKR_DOMAIN}
          - auth.${STACKR_DOMAIN}

  # With the restore drill's alert: it hasn't passed in eight days.
  grafana:
    ports: !override
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - ./deploy/host/grafana/alerting:/etc/grafana/provisioning/alerting:ro
  langfuse-web:
    ports: !override
      - 127.0.0.1:${LANGFUSE_PORT:-3300}:3000
    networks: !override [default]
  litellm:
    ports: !override
      - 127.0.0.1:${LITELLM_PORT:-4400}:4000
    networks: !override [default]
  minio:
    ports: !override
      - 127.0.0.1:${MINIO_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001

  otel-collector:
    ports: !reset []
  tempo:
    ports: !reset []
  prometheus:
    ports: !reset []
  prom-label-proxy:
    ports: !reset []
  loki:
    ports: !reset []
  pyroscope:
    ports: !reset []
  # PostgreSQL with pgBackRest (deploy/host/postgres), archiving its WAL to the backups' bucket,
  # encrypted with BACKUP_CIPHER_PASS.
  postgres:
    build: ./deploy/host/postgres
    image: stackr-postgres:local
    environment:
      <<: &bucket
        BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
        BACKUP_S3_PORT: ${BACKUP_S3_PORT:-443}
        BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
        BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
        BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
        BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?run make env}
    volumes:
      - &ca ${BACKUP_S3_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}:/etc/stackr/backup-ca.crt:ro
    ports: !reset []
  # ClickHouse's BACKUP and RESTORE, to the same bucket, as the `backup` user, through the
  # `backups` named collection.
  clickhouse:
    environment:
      <<: *bucket
      # yamllint disable-line rule:line-length
      CLICKHOUSE_BACKUP_URL: https://${BACKUP_S3_ENDPOINT:-backups.invalid}:${BACKUP_S3_PORT:-443}/${BACKUP_S3_BUCKET:-none}/clickhouse/
      CLICKHOUSE_BACKUP_PASSWORD: ${CLICKHOUSE_BACKUP_PASSWORD:?run make env}
    volumes:
      - *ca
      - ./deploy/host/clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - ./deploy/host/clickhouse/backup-user.xml:/etc/clickhouse-server/users.d/backup-user.xml:ro
  # Reached at the edge, as auth.<domain>. Caddy sets X-Forwarded-For to each client's address,
  # which GoTrue's per-address rate limits read: without the header it applies none.
  gotrue:
    ports: !reset []
    environment:
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For

  # PostgreSQL is the postgres service, on the stack's own network: local Supabase's goes.
  db-init:
    networks: !override [default]
  langfuse-worker:
    networks: !override [default]

  probe:
    networks: !override [default]

volumes:
  caddy-data:
  caddy-config:
