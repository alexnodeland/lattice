# artifactr, distributed as artifactr-ai.
language: 'python'
layer: 'library'
tags: ['distribution', 'api']
dependsOn:
  - 'evalr'
  - 'lattice-core'

tasks:
  api:
    env:
      API_SERVICE: 'docplan'
      # docplan serves native files' surface too, which artifactr-files.openapi.json describes.
      DOCPLAN_FILES: 'fake'
      # Ports the system picks, which scripts/api reads back.
      DOCPLAN_PORT: '0'
      ARTIFACTR_PG_PORT: '0'
    inputs:
      # docplan, the reference application the collection runs against.
      - '/examples/docplan/**/*'

  test:
    # A worker for each of the runner's cores, sharing nothing (lattice ADR-0010).
    args: ['--numprocesses', 'auto']
    inputs:
      # The layering test holds docplan, the reference implementation, to the public API.
      - '/examples/docplan/src/**/*'
      # $ARTIFACTR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
      # always sets it, so every pull request would run these tests. CI never restores moon's
      # cache; locally, `moon run artifactr:test --force` runs the PostgreSQL tests past a cached
      # run without them.

  # TLC over the thread claim's TLA+ spec (lattice ADR-0025), at a pull request's bounds. CI's Specs
  # job runs it in each affected project; it needs Java 11 or later. The inputs are what the spec
  # models: the runner and its capability, the workspace and its claim, the storages' leases and
  # core's run rules.
  spec:
    description: "Model-check the thread claim's TLA+ spec with TLC, at a pull request's bounds"
    command: >-
      $workspaceRoot/scripts/tlc $workspaceRoot/docs/artifactr/spec/ThreadClaim.tla
      ThreadClaim.cfg ThreadClaimLapse.cfg ThreadClaimLive.cfg ThreadClaimRecovery.cfg
    inputs:
      - '/docs/artifactr/spec/**/*'
      - '/scripts/tlc'
      - '/scripts/tlc.sha256'
      - 'src/artifactr/agent/**/*'
      - 'src/artifactr/workspace/**/*'
      - 'src/artifactr/sql/storage.py'
      - 'src/artifactr/core/rules.py'

  # The same at Nightly's deeper bounds.
  spec-deep:
    description: "Model-check the thread claim's TLA+ spec with TLC, at Nightly's deeper bounds"
    command: >-
      $workspaceRoot/scripts/tlc $workspaceRoot/docs/artifactr/spec/ThreadClaim.tla
      ThreadClaimDeep.cfg
    inputs:
      - '/docs/artifactr/spec/**/*'
      - '/scripts/tlc'
      - '/scripts/tlc.sha256'
      - 'src/artifactr/agent/**/*'
      - 'src/artifactr/workspace/**/*'
      - 'src/artifactr/sql/storage.py'
      - 'src/artifactr/core/rules.py'

  schema:
    description: "Regenerate the protocol JSON Schema, the REST surfaces' OpenAPI documents, the forms' and the diagrams' wire schemas, and the diagrams' image routes"
    script: >-
      uv run python -m artifactr.core.schema > schemas/artifactr.v1.json
      && uv run python -m artifactr.fastapi.openapi > schemas/artifactr.openapi.json
      && uv run python -m artifactr.files.fastapi.openapi > schemas/artifactr-files.openapi.json
      && uv run python -m artifactr.ui.wire > schemas/artifactr_ui.v1.json
      && uv run python -m artifactr.excalidraw.wire > schemas/artifactr_excalidraw.v1.json
      && uv run python -m artifactr.excalidraw.openapi > schemas/artifactr-excalidraw.openapi.json
    options:
      cache: false
      runInCI: false

  dashboards:
    description: 'Regenerate the Grafana dashboards in deploy/grafana/dashboards'
    command: 'uv run python scripts/grafana_dashboards.py'
    options:
      cache: false
      runInCI: false

  pg-up:
    description: "Start PostgreSQL for the SQL tests, from compose.yaml, on port 54329"
    command: 'docker compose up -d --wait postgres'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop the contributor stack: PostgreSQL, and docplan if it runs'
    command: 'docker compose --profile app down'
    options:
      cache: false
      runInCI: false

  app-up:
    description: 'Build and start docplan, the reference app, on PostgreSQL, at http://localhost:8000'
    command: 'docker compose --profile app up -d --build --wait'
    options:
      cache: false
      runInCI: false

  # A crafting app's fidelity report (lattice RFC-0003, phase 2): its pinned CLI opens and saves
  # each file of its corpus, feature by feature, and its adapter runs live, as does WordCraft's
  # check-out pilot over HTTP with the browser build served, and, for an app the stackr template
  # wires, the agent creates a blank file through its worker and proposes a first edit. CRAFT
  # names the app, wordcraft if unset; Nightly runs it for each app with a corpus and publishes
  # the matrix. It downloads the
  # release scripts/craft pins, once. FreeCAD and Blender have no browser build.
  fidelity:
    description: "Run a crafting app's fidelity report and live tests, on its pinned CLI (CRAFT=app)"
    script: >-
      app=${CRAFT:-wordcraft} && cli=$($workspaceRoot/scripts/craft $app cli)
      && web=$(case $app in freecad | blender) ;; *) $workspaceRoot/scripts/craft $app web ;; esac)
      && ARTIFACTR_TEST_CRAFT=$app ARTIFACTR_TEST_CRAFT_CLI=$cli ARTIFACTR_TEST_CRAFT_WEB=$web
      uv run pytest -m craft -p no:cacheprovider --durations=10 tests/files
    # It runs in CI, where Nightly names it; no pull request's job does.
    options:
      cache: false

  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    command: 'uv run pytest --cov --cov-report=term-missing --durations=10'
    env:
      ARTIFACTR_TEST_POSTGRES_URL: 'postgresql+asyncpg://postgres:artifactr@localhost:54329/postgres'
    options:
      cache: false
      runInCI: false
