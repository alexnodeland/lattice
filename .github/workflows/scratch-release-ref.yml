# Scratch: proves release.yml's wheel checkout (issue 184). Removed before this branch merges.
name: Scratch release ref
on:
  pull_request:
permissions: {}
jobs:
  proof:
    name: Scratch (release ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        path: [packages/artifactr]
    env:
      # What release-please's outputs would hold for a release made on an earlier commit than this push.
      RELEASES: '{"packages/artifactr--sha": "95ffe9641ecce3797dcfa6dd2276cdcb08d00920", "packages/artifactr--tag_name": "artifactr-v0.0.0"}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(env.RELEASES)[format('{0}--sha', matrix.path)] }}
          persist-credentials: false
      - name: The checkout is the release's commit, not the push's
        env:
          WANTED: 95ffe9641ecce3797dcfa6dd2276cdcb08d00920
          PUSH: ${{ github.sha }}
        run: |
          echo "HEAD=$(git rev-parse HEAD) wanted=$WANTED push=$PUSH"
          [[ $(git rev-parse HEAD) == "$WANTED" && $WANTED != "$PUSH" ]]
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
        with:
          cache: false
      - name: Build the package alone, as the release does
        working-directory: ${{ matrix.path }}
        run: uv build --no-sources --out-dir dist && ls -l dist
