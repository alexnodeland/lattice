# Spike #899, throwaway OpenSandbox config: Docker runtime (Docker-in-Docker), gVisor.
[server]
host = "127.0.0.1"
port = 47104
[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.1.0"
[store]
type = "sqlite"
path = "/tmp/opensandbox-spike899.db"
[docker]
network_mode = "bridge"
[secure_runtime]
type = "gvisor"
docker_runtime = "runsc"
[ingress]
mode = "direct"
