# The people's UI: sign in, pick a tenant and a workspace, and work.
language: 'typescript'
layer: 'application'
dependsOn:
  - 'client'
  - 'notices'
  - 'ui'

tasks:
  build:
    # Its own files, and the packages it bundles, whose sources and styles it builds from.
    inputs:
      - '**/*'
      - '/packages/portalr/web/client/src/**/*'
      - '/packages/portalr/web/ui/src/**/*'
      # What the third-party notices are made of, and the policy they are checked against.
      - '/packages/portalr/web/notices/src/**/*'
      - '!/packages/portalr/web/notices/src/**/*.test.ts'
      - '/packages/portalr/web/notices/policy.json'
    outputs:
      - '/packages/portalr/src/portalr/static/app/**/*'
    options:
      mergeOutputs: 'replace'

  # The app's scenarios against portalr's test application, with Supabase Auth (portalr ADR-0013),
  # in CI's Acceptance job. It needs Docker, and Chromium for Playwright.
  bdd:
    description: "Run the app's scenarios against portalr's test application"
    command: 'scripts/bdd'
    deps:
      - 'app:build'
      - 'admin:build'
      - 'ui:chromium'
    inputs:
      - 'bdd/**/*'
      - 'src/**/*'
      - 'scripts/bdd'
      - 'playwright.config.ts'
      - '/packages/portalr/compose.yaml'
      - '/packages/portalr/tests/app/**/*'
      - '/packages/portalr/src/**/*'
      - '/packages/grantr/src/**/*'
      - '/packages/artifactr/src/**/*'
      - '/packages/reflexr/src/**/*'
      - '/packages/lattice-core/src/**/*'
      - '/packages/stackr/deploy/otel-collector/**/*'
    options:
      cache: false
