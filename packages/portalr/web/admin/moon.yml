# The UI for a tenant's owners and admins, and the deployment's operators.
language: 'typescript'
layer: 'application'
dependsOn:
  - 'client'
  - 'ui'

tasks:
  build:
    # Its own files, and the packages it bundles, whose sources and styles it builds from.
    inputs:
      - '**/*'
      - '/packages/portalr/web/client/src/**/*'
      - '/packages/portalr/web/ui/src/**/*'
    outputs:
      - '/packages/portalr/src/portalr/static/admin/**/*'
    options:
      mergeOutputs: 'replace'

  # admin's scenarios against portalr's test application, with Supabase Auth and the telemetry
  # tools (portalr ADR-0023), in CI's Acceptance job. It needs Docker, and Chromium for Playwright.
  bdd:
    description: "Run admin's scenarios against portalr's test application"
    command: 'scripts/bdd'
    # The test application's image carries whichever UIs are built; these scenarios need admin.
    deps:
      - 'admin:build'
      - 'ui:chromium'
    inputs:
      - 'bdd/**/*'
      - 'src/**/*'
      - 'scripts/bdd'
      - 'playwright.config.ts'
      - '/packages/portalr/compose.yaml'
      - '/packages/portalr/tests/app/**/*'
      - '/packages/portalr/src/**/*'
      - '/packages/grantr/src/**/*'
      - '/packages/artifactr/src/**/*'
      - '/packages/reflexr/src/**/*'
      - '/packages/stackr/deploy/otel-collector/**/*'
    options:
      cache: false
