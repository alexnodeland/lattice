# lattice-core: what the libraries share and must keep identical. It imports none of them.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn: []

tasks:
  schema:
    description: "Regenerate the platform contracts' JSON Schemas (lattice RFC-0011)"
    script: >-
      uv run python $workspaceRoot/scripts/generate.py schemas/adapters.v1.json lattice_core.contracts adapters
      && uv run python $workspaceRoot/scripts/generate.py schemas/approvals.v1.json lattice_core.contracts approvals
      && uv run python $workspaceRoot/scripts/generate.py schemas/capabilities.v1.json lattice_core.contracts capabilities
      && uv run python $workspaceRoot/scripts/generate.py schemas/commands.v1.json lattice_core.contracts commands
      && uv run python $workspaceRoot/scripts/generate.py schemas/egress.v1.json lattice_core.contracts egress
      && uv run python $workspaceRoot/scripts/generate.py schemas/secrets.v1.json lattice_core.contracts secrets
    options:
      cache: false
      runInCI: false
