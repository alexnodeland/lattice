# The pull request's title becomes its squash commit, so it must be a Conventional Commit. It is
# checked again whenever the title is edited, which CI's jobs never rerun for, so it is a
# workflow and a required check of its own. Scopes are the packages' module and area names, as
# before, and aren't listed here: a new module brings a new scope.

name: Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
