# stackr: the stack and the application template. It ships no wheel, and its checks are its own,
# so it inherits none of the Python projects' tasks.
language: 'bash'
layer: 'tool'
# The template generates applications on the libraries.
dependsOn:
  - 'artifactr'
  - 'reflexr'
  - 'evalr'
  - 'grantr'
  - 'relayr'

# Its tasks run the workspace's tools, so the lock and the root's configuration are inputs too.
tasks:
  validate:
    description: 'Validate every configuration without starting containers'
    command: 'make validate'
    inputs:
      - '**/*'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/copier.yml'

  reference:
    description: "Check that the documentation's reference pages match the files they describe"
    command: 'uv run scripts/docs-reference --check'
    inputs:
      - '**/*'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/docs/stackr/reference/**/*'

  access-matrix:
    description: "Check the template's access matrix against the libraries' catalogs and grantr's roles"
    command: 'uv run scripts/access-matrix --check'
    inputs:
      - 'scripts/access-matrix'
      - 'template/**/*'
      - '/packages/artifactr/src/**/*'
      - '/packages/reflexr/src/**/*'
      - '/packages/grantr/src/**/*'
      - '/uv.lock'

  aws:
    description: "The AWS recipe's tier 1: format, TFLint, checkov, tests against a mocked AWS, and the templates"
    command: 'deploy/aws/check'
    inputs:
      - 'deploy/aws/**/*'
      # GoTrue's proxy runs the single host's Caddy.
      - 'deploy/host/compose.prod.yaml'
      - '/.prototools'

  images:
    description: "Build the AWS recipe's thin images for this machine, and check each starts on its configuration"
    command: 'deploy/build-images'
    # And the release's scripts, which CI's "Release images" jobs run when these change.
    inputs:
      - 'deploy/build-images'
      - 'deploy/image-archive'
      - 'deploy/publish-image'
      - '/.github/workflows/release.yml'
      - 'deploy/otel-collector/**/*'
      - 'deploy/tempo/**/*'
      - 'deploy/loki/**/*'
      - 'deploy/pyroscope/**/*'
      - 'deploy/grafana/**/*'
      - 'deploy/litellm/**/*'
      - 'deploy/db-init/**/*'
      - 'deploy/auth-keys/**/*'
      - 'deploy/postgres/init.sql'
      - 'scripts/auth-keys'
      - 'scripts/_auth_keys.py'
      - 'pyproject.toml'
      - '/pyproject.toml'
      - '/uv.lock'
      - 'compose.yaml'
      - '/packages/artifactr/deploy/grafana/**/*'
      - '/packages/reflexr/deploy/grafana/**/*'

  # On an arm64 Docker; CI runs it when the recipe or an image changes, and nightly.
  aws-tier2:
    description: "The AWS recipe's tier 2: envs/floci against Floci, with the thin images and an application, smoked"
    command: 'deploy/aws/tier2'
    # The recipe, the images' files, and the application it generates from the template.
    inputs:
      - 'deploy/aws/**/*'
      - 'deploy/host/compose.prod.yaml'
      - 'deploy/image-archive'
      - 'deploy/otel-collector/**/*'
      - 'deploy/tempo/**/*'
      - 'deploy/loki/**/*'
      - 'deploy/pyroscope/**/*'
      - 'deploy/grafana/**/*'
      - 'deploy/litellm/**/*'
      - 'deploy/db-init/**/*'
      - 'deploy/auth-keys/**/*'
      - 'deploy/postgres/init.sql'
      - 'scripts/auth-keys'
      - 'scripts/_auth_keys.py'
      - 'pyproject.toml'
      - 'compose.yaml'
      - 'copier.yml'
      - 'template/**/*'
      - '/copier.yml'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/.prototools'
      - '/packages/artifactr/deploy/grafana/**/*'
      - '/packages/reflexr/deploy/grafana/**/*'
    options:
      cache: false

  # Online, so not one of check's dependencies: `make validate` stays offline. CI runs it when one
  # of these changes (stackr ADR-0026).
  gotrue:
    description: "Check that GoTrue's image is the one the pinned Supabase CLI runs, reading the CLI's pins from GitHub"
    command: 'uv run scripts/check-config gotrue'
    inputs:
      - 'scripts/check-config'
      - 'versions.env'
      - 'compose.yaml'
      - 'deploy/aws/modules/stack/locals.tf'
    options:
      cache: false

  check:
    description: "Run the project's checks, as CI does"
    command: 'noop'
    deps:
      - 'validate'
      - 'reference'
      - 'access-matrix'

  # CI's Template and Smoke jobs, with their matrix values in the environment. The values aren't
  # inputs: moon counts a variable that is set as a change, so every variant would run on every
  # pull request.
  template:
    description: 'Generate one application from the template and run its own checks'
    command: 'scripts/check-app'
    inputs:
      - '**/*'
      - '/copier.yml'
      - '/uv.lock'
    options:
      cache: false

  smoke:
    description: 'Start the stack (PROFILES, STACKR_DATABASE) and send telemetry through it'
    script: 'make up && make smoke'
    # It also runs portalr's readers for Langfuse and LiteLLM, which nothing else runs up.
    inputs:
      - '**/*'
      - '/packages/portalr/src/portalr/readers/**/*'
      - '/packages/portalr/scripts/smoke_readers.py'
    options:
      cache: false
      # Streamed, not held until the task ends: a stalled run still shows how far it got.
      outputStyle: 'stream'

  smoke-app:
    description: 'Run an application from the template beside the running stack'
    command: 'make smoke-app'
    options:
      cache: false
