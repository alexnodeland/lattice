# reflexr.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn:
  - 'evalr'

tasks:
  test:
    inputs:
      # The layering test holds oncall, the reference implementation, to the public API.
      - '/examples/oncall/src/**/*'
      # $REFLEXR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
      # always sets it, so every pull request would run these tests. CI never restores moon's
      # cache; locally, `moon run reflexr:test --force` runs the PostgreSQL tests past a cached
      # run without them.

  schema:
    description: 'Regenerate the rule and protocol JSON Schemas from the models'
    script: 'uv run python -m reflexr.core.schema rules > schemas/reflexr.rules.v1.json && uv run python -m reflexr.core.schema protocol > schemas/reflexr.v1.json'
    options:
      cache: false
      runInCI: false

  dashboards:
    description: 'Regenerate the Grafana dashboards in deploy/grafana/dashboards'
    command: 'uv run python scripts/grafana_dashboards.py'
    options:
      cache: false
      runInCI: false

  pg-up:
    description: "Start PostgreSQL for the SQL tests, from compose.yaml, on port 54330"
    command: 'docker compose up -d --wait postgres'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop the contributor stack: PostgreSQL, and oncall if it runs'
    command: 'docker compose --profile app down'
    options:
      cache: false
      runInCI: false

  app-up:
    description: 'Build and start oncall, the reference app, on PostgreSQL, at http://localhost:8000'
    command: 'docker compose --profile app up -d --build --wait'
    options:
      cache: false
      runInCI: false

  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    command: 'uv run pytest --cov --cov-report=term-missing'
    env:
      REFLEXR_TEST_POSTGRES_URL: 'postgresql+asyncpg://postgres:reflexr@localhost:54330/postgres'
    options:
      cache: false
      runInCI: false
