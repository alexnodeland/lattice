# The application template (RFC-0001 phase 5, ADR-0011): a new application on artifactr,
# reflexr or both, wired to the stack's ports.
#
#   uvx copier copy gh:alexnodeland/lattice my-app    # from GitHub
#   uvx copier copy path/to/lattice my-app            # from a clone
#   uvx copier update                                 # later, in the application
#
# Copier takes the latest tag that parses as a version. lattice's tags carry their package's
# name (stackr-v0.1.0), and none parses, so Copier warns that it found no release and takes
# HEAD instead: main's, from GitHub. `--vcs-ref` names another revision.
#
# The template's files are in template/. Copier takes a repository, not a directory of one,
# so lattice's root copier.yml includes these questions and points Copier at template/.

_subdirectory: template
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: The application's name, as people read it
  default: My App
  validator: >-
    {% if not project_name.strip() %}The name can't be empty{% endif %}

project_slug:
  type: str
  help: >-
    Its slug: the Python distribution, the OpenTelemetry service and the Compose project
  default: >-
    {{ project_name.strip().lower() | regex_replace('[^a-z0-9]+', '-') | trim('-') }}
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Lowercase letters, digits and single dashes, starting with a letter
    {% elif project_slug | length > 30 %}
    At most 30 characters
    {% elif project_slug in ['artifactr', 'artifactr-ai', 'reflexr', 'evalr'] %}
    One of the libraries' names
    {% endif %}

description:
  type: str
  help: One line about what it does
  default: An application on stackr.

libraries:
  type: str
  help: The libraries it uses
  choices:
    artifactr (people and agents edit shared artifacts): artifactr
    reflexr (rules over event streams run agents): reflexr
    both, mounted side by side on one database: both
  default: both

evals:
  type: bool
  help: Include evaluation with evalr (an evals/ directory and a starter experiment)?
  default: true

bridge:
  type: bool
  help: >-
    Bridge them with relayr (chats and artifacts become events for rules, and rules' runs act
    back as proposals and notices; with an incident timeline example)?
  default: true
  when: "{{ libraries == 'both' }}"

access:
  type: str
  help: Who may do what
  choices:
    grantr (tenants, members, roles and keys; the request names its tenant): grantr
    none (any user of a tenant, named in their token, may do anything in it): none
  default: grantr

hosting:
  type: str
  help: Where it is hosted, beside stackr's recipe for it (stackr RFC-0004)
  choices:
    none (beside the stack on this machine only): none
    host (a single host, behind stackr's edge): host
  default: none

python_version:
  type: str
  help: The Python version it runs on
  choices: ["3.12", "3.13", "3.14"]
  default: "3.12"

app_port:
  type: int
  help: The port it is published on, on this machine
  default: 8800
  validator: >-
    {% if app_port < 1024 or app_port > 65535 %}Choose a port from 1024 to 65535{% endif %}

# Never asked, and not recorded in the answers. The application installs the libraries from
# lattice at the commit the template is rendered from (ADR-0018), so `copier update` moves them
# with the template's code. libraries_path, a path to lattice's packages/, installs them from a
# checkout instead: scripts/check-app sets it, to check a library's change with the template's.
# The rest are derived from the answers.
libraries_path:
  type: str
  default: ""
  when: false

package_name:
  type: str
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

use_artifactr:
  type: bool
  default: "{{ libraries in ['artifactr', 'both'] }}"
  when: false

use_reflexr:
  type: bool
  default: "{{ libraries in ['reflexr', 'both'] }}"
  when: false

use_relayr:
  type: bool
  default: "{{ libraries == 'both' and bridge }}"
  when: false
