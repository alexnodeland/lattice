[project]
name = "artifactr-ai"
version = "0.4.0"
description = "Build chat applications where people and agents collaborate through shared, versioned artifacts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "collaboration", "artifacts", "pydantic-ai", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "lattice-core-ai>=0.3.0",
    "pydantic>=2.13",
    "jsonpatch>=1.33",
    "jsonpointer>=1.9",
    "pydantic-ai-slim>=2.53",
    "opentelemetry-api>=1.28",
]

[project.optional-dependencies]
sql = ["lattice-core-ai[sql]>=0.2.0", "sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]
sqlite = ["artifactr-ai[sql]", "aiosqlite>=0.22"]
postgres = ["artifactr-ai[sql]", "asyncpg>=0.31"]
fastapi = ["fastapi>=0.141", "starlette>=0.46.0"]
mcp = ["mcp>=2.2", "starlette>=0.27"]
# The SDK's setup is lattice-core's; this package imports the SDK for its own views.
otel = ["lattice-core-ai[otel]>=0.2.0", "opentelemetry-sdk>=1.45"]
langfuse = [
    "lattice-core-ai[langfuse]>=0.2.0",
    "langfuse>=4.15,<5",
    # The score mapping and ports that artifactr.scores' mirror builds on, and evalr.langfuse's
    # score adapters, which send the mirror's scores to Langfuse.
    "evalr[langfuse]>=0.1.0",
]
litellm = ["lattice-core-ai[litellm]>=0.2.0"]
evals = ["evalr>=0.1.0"]
# Native files (lattice RFC-0003): artifactr.files, with its SQL stores in the sql extra. The
# extra names the integration, and carries the apps' adapters' dependencies: WordCraft's speaks
# MCP on stdio, under anyio's deadlines (lattice ADR-0026); the worker serves an app over HTTP,
# and the application calls it with httpx. Blender's scan inflates a file Blender compressed with
# zstd, which Python 3.12's standard library can't (native files ADR-0015).
files = [
    "mcp>=2.2",
    "anyio>=4.9",
    "starlette>=0.46.0",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "zstandard>=0.25",
]
# Connected apps (ADR-0085): an operator's own FreeCAD or Blender, through its community MCP
# server, spawned on stdio under anyio's deadlines, as native files' apps are.
connect = ["mcp>=2.2", "anyio>=4.9"]
# Forms and dashboards in the chat, artifactr.ui (ADR-0074): what it imports beyond artifactr's own
# dependencies, Pydantic's core, which Pydantic installs already. The name an application installs
# the forms by, which a dependency they ever need joins.
forms = ["pydantic-core>=2.46.0"]
# Excalidraw diagrams, artifactr.excalidraw (lattice RFC-0006, as ADR-0026 amends it): the name an
# application installs them by. The agent's tools keep a drawing's images in native files' blob
# store, and call the converter's worker with httpx under anyio's deadlines, so it is the files
# extra whole: with them, mcp, starlette, uvicorn and zstandard (artifactr ADR-0090).
excalidraw = ["artifactr-ai[files]"]

[project.urls]
Homepage = "https://lattice.alexnodeland.com/artifactr/"
Documentation = "https://lattice.alexnodeland.com/artifactr/"
Repository = "https://github.com/alexnodeland/lattice"
Issues = "https://github.com/alexnodeland/lattice/issues"
Changelog = "https://github.com/alexnodeland/lattice/blob/main/packages/artifactr/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "hypothesis>=6.168",
    "httpx>=0.28",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "opentelemetry-sdk>=1.28",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# In lattice, evalr and lattice-core are the checkout's. A built wheel keeps the ranges in
# [project] alone.
[tool.uv.sources]
evalr = { workspace = true }
lattice-core-ai = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Distributed as artifactr-ai (ADR-0025); imported as artifactr.
[tool.uv.build-backend]
module-name = "artifactr"

# ─── dependencies ─────────────────────────────────────────────────────────────

# deptry can't tell from the workspace's editable install which module lattice-core-ai provides.
[tool.deptry.package_module_name_map]
lattice-core-ai = "lattice_core"

# FreeCAD's script runs in FreeCAD's own interpreter, on its modules and the Pillow it ships, and
# Blender's in Blender's, on its modules (native files ADR-0014, ADR-0015).
[tool.deptry.per_rule_ignores]
DEP001 = ["FreeCAD", "Part", "Sketcher", "TechDraw", "PIL", "bpy", "bmesh", "mathutils"]

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A test that runs for a minute is stuck: fail it with its stack, as a failure of its own, by
# SIGALRM, so the xdist worker running it carries on (lattice ADR-0007, ADR-0028).
timeout = 60
timeout_method = "signal"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # backoff, which Langfuse uses, calls asyncio.iscoroutinefunction, deprecated in Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff._decorator",
]
markers = [
    "postgres: needs a PostgreSQL database (set ARTIFACTR_TEST_POSTGRES_URL)",
    "craft(app): needs the crafting app's CLI (set ARTIFACTR_TEST_CRAFT to the app, and ARTIFACTR_TEST_CRAFT_CLI from scripts/craft APP cli)",
]

[tool.coverage.run]
branch = true
# By path rather than package name, so the migrations Alembic loads from files are measured too.
source = ["src/artifactr"]
# SQLAlchemy runs run_sync callables in a greenlet, which coverage follows only when told.
concurrency = ["greenlet", "thread"]
# FreeCAD's and Blender's scripts run in their apps' own interpreters, which pull requests don't
# have; Nightly's fidelity job runs them live (native files ADR-0014, ADR-0015).
omit = [
    "src/artifactr/files/freecad/console/script.py",
    "src/artifactr/files/blender/console/script.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
