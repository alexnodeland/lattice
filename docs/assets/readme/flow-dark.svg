<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
<title id="t">How lattice fits together</title>
<desc id="d">People use portalr, which talks to artifactr and reflexr. relayr carries events from artifactr to reflexr, and reflexr's runs act back in artifactr. grantr checks every command and read, evalr judges the agents, and everything runs on stackr's stack.</desc>
<style>
  text { font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .cap { font-size: 15px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 12; animation: flow 1.2s linear infinite; }
  .back { animation-direction: reverse; }
  .tick { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 3 7; animation: flow 2s linear infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  @keyframes pulse { 50% { opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .wire, .tick, .pulse { animation: none; } }
</style>
