[project]
name = "docplan"
version = "0.1.0"
description = "artifactr's reference implementation: a person and an agent co-write a doc and plan the work."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "artifactr-ai[fastapi,mcp,sqlite,postgres,otel,langfuse,litellm,evals]",
    "pydantic-ai-slim[anthropic,openai]>=2.51",
    "uvicorn[standard]>=0.54",
    "websockets>=17.1",
    "rich>=15.0",
    "prompt-toolkit>=3.0.53",
    "httpx>=0.28",
]

[project.optional-dependencies]
# A DSPy judge, used instead of the function judge when DOCPLAN_JUDGE_MODEL is set.
dspy = ["evalr[dspy]"]

[project.scripts]
docplan-serve = "docplan.app:main"
docplan = "docplan.cli:main"
docplan-eval = "docplan.evaluate:main"

[tool.uv.sources]
artifactr-ai = { workspace = true }
evalr = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Its library's test and lint tools, which its tests ran with before.
[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"
stubPath = "../../packages/artifactr/typings"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A test that runs for a minute is stuck: fail it, with every thread's stack.
timeout = 60
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # backoff, which Langfuse uses, calls asyncio.iscoroutinefunction, deprecated in Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff._decorator",
]

[tool.coverage.run]
branch = true
source = ["src/docplan"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
