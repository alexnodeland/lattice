# moon runs every task, and only the ones a change affects (stackr's RFC-0003, moon). uv manages
# the Python dependencies and Bun the web packages'; moon never edits a manifest or a lockfile.

# lattice is the root-level project: the documentation site and its own tests.
projects:
  lattice: '.'
  artifactr: 'packages/artifactr'
  reflexr: 'packages/reflexr'
  evalr: 'packages/evalr'
  relayr: 'packages/relayr'
  grantr: 'packages/grantr'
  stackr: 'packages/stackr'
  portalr: 'packages/portalr'
  client: 'packages/portalr/web/client'
  ui: 'packages/portalr/web/ui'
  app: 'packages/portalr/web/app'
  admin: 'packages/portalr/web/admin'
  docplan: 'examples/docplan'
  oncall: 'examples/oncall'

vcs:
  defaultBranch: 'main'

versionConstraint: '>=2.5.6'
