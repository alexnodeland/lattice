# Tempo 3, as a single process (monolithic mode, which needs no Kafka). It
# receives traces from the Collector over OTLP, and its metrics generator
# derives span metrics and service graphs, remote-written to Prometheus with
# exemplars. Its blocks are on a local volume on one machine, and in S3 on AWS
# (stackr ADR-0034), as the environment says: Tempo reads it with
# -config.expand-env=true, and each setting has one machine's value by default.
# Expanded, a literal $ is written $$.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# For local use, a trace is searchable as soon as it arrives, rather than
# after the default 30-second cutoff.
query_frontend:
  query_end_cutoff: 0s
live_store:
  fail_on_high_lag: false

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://${PROMETHEUS_ADDRESS:-prometheus}:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: ${TEMPO_BACKEND:-local}
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    s3:
      bucket: ${S3_BUCKET:-}
      prefix: ${S3_PREFIX:-}
      endpoint: ${S3_ENDPOINT:-}
      region: ${S3_REGION:-}
      insecure: ${S3_INSECURE:-false}
      forcepathstyle: ${S3_PATH_STYLE:-false}

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
