[project]
name = "artifactr-files-ai"
version = "0.1.0"
description = "Native files as artifactr artifacts: a manifest over the file's bytes, edits by the file's own application, and one writer at a time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "collaboration", "artifacts", "documents", "docx", "files"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# artifactr-ai's floor is raised by hand (lattice RFC-0003). The lease on an artifact this package
# takes is in artifactr's next release; the floor rises to it once that release is on main.
dependencies = [
    "artifactr-ai>=0.2.0",
    "pydantic>=2.13",
]

[project.optional-dependencies]
sql = ["lattice-core-ai[sql]>=0.1.0", "sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]
sqlite = ["artifactr-files-ai[sql]", "aiosqlite>=0.22"]
postgres = ["artifactr-files-ai[sql]", "asyncpg>=0.31"]

[project.urls]
Homepage = "https://lattice.alexnodeland.com/artifactr-files/"
Documentation = "https://lattice.alexnodeland.com/artifactr-files/"
Repository = "https://github.com/alexnodeland/lattice"
Issues = "https://github.com/alexnodeland/lattice/issues"
Changelog = "https://github.com/alexnodeland/lattice/blob/main/packages/artifactr-files/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "hypothesis>=6.168",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# In lattice, artifactr and lattice-core are the checkout's. A built wheel keeps the ranges in
# [project] alone.
[tool.uv.sources]
artifactr-ai = { workspace = true }
lattice-core-ai = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Distributed as artifactr-files-ai; imported as artifactr_files.
[tool.uv.build-backend]
module-name = "artifactr_files"

# ─── dependencies ─────────────────────────────────────────────────────────────

# deptry can't tell from the workspace's editable install which module a distribution named
# apart from its module provides.
[tool.deptry.package_module_name_map]
artifactr-ai = "artifactr"
lattice-core-ai = "lattice_core"

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A test that runs for a minute is stuck: fail it, with every thread's stack.
timeout = 60
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "postgres: needs a PostgreSQL database (set ARTIFACTR_FILES_TEST_POSTGRES_URL)",
]

[tool.coverage.run]
branch = true
# By path rather than package name, so the migrations Alembic loads from files are measured too.
source = ["src/artifactr_files"]
# SQLAlchemy runs run_sync callables in a greenlet, which coverage follows only when told.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
