# portalr's acceptance stack (lattice ADR-0015): its test application, the tools its readers read,
# and stackr's Collector, which the application sends its own telemetry through, each as stackr
# runs it, with stackr's own configurations (portalr ADR-0023). Langfuse and LiteLLM aren't here:
# their reads are unavailable (portalr ADR-0011), or unconfigured where their URL is set empty.
# `moon run portalr:api` runs it. With the `bdd` profile, Supabase Auth (GoTrue, alone) and its
# database come too, for the UIs' scenarios (`moon run app:bdd` and `admin:bdd`, portalr
# ADR-0013 and ADR-0023).
#
# Ports are the system's to pick, which the scripts read back.

name: portalr

services:
  app:
    profiles: [app]
    build:
      # lattice's root, which holds the one uv.lock.
      context: ../..
      dockerfile: packages/portalr/tests/app/Dockerfile
    ports:
      - "127.0.0.1::8000"
    environment:
      PORTALR_JWT_SECRET: &secret portalr-test-only-jwt-secret-not-for-use
      PORTALR_GOTRUE_URL: http://gotrue:9999
      # Empty leaves the tool unconfigured, as admin's scenarios run it; unset, it's unavailable.
      PORTALR_LANGFUSE_URL: ${PORTALR_LANGFUSE_URL-http://langfuse:3000}
      PORTALR_LITELLM_URL: ${PORTALR_LITELLM_URL-http://litellm:4000}
      # Its own telemetry, through stackr's Collector, as an application's goes (portalr ADR-0023),
      # but not of compose's health check, which asks for config.json every two seconds.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: portalr/config.json
      # Each second, so a scenario reads a turn's metrics back while it runs.
      OTEL_METRIC_EXPORT_INTERVAL: "1000"
      # The hosted editor's address, as the browser reaches it: the app's scenarios start the
      # editor first and name it here; empty, no editor is hosted.
      PORTALR_EDITOR_URL: ${PORTALR_EDITOR_URL-}
    # Loki's image has no shell or probe of its own, so the application's check waits for it too.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          for url in ("http://127.0.0.1:8000/portalr/config.json", "http://loki:3100/ready"):
              urllib.request.urlopen(url)
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      otel-collector:
        condition: service_started
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      prom-label-proxy:
        condition: service_healthy

  # The hosted editor, under the `editor` profile: a stand-in for an app's browser build, served
  # by artifactr's editor_app on a port of its own, so on another origin than the application's
  # (tests/app/editor.py). The app's scenarios start it first, to name its address to the app.
  editor:
    profiles: [editor]
    build:
      context: ../..
      dockerfile: packages/portalr/tests/app/Dockerfile
    command: ["uvicorn", "tests.app.editor:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1::8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/")
      interval: 2s
      timeout: 5s
      retries: 30

  # stackr's Collector, with its own configuration: it copies the libraries' tenant attributes to
  # `tenant.id`, and sends traces to Tempo alone, metrics to Prometheus, and logs to Loki. It
  # publishes nothing; the application reaches it on compose's network.
  otel-collector:
    profiles: [app]
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      STACKR_ENVIRONMENT: test
      STACKR_TRACES_EXPORTERS: "[otlp_grpc/tempo]"
      LANGFUSE_OTLP_AUTH: unused
    volumes:
      - ../stackr/deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    volumes:
      - ../stackr/deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1::3200"
      - "127.0.0.1::4318"
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      prometheus:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - ../stackr/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1::9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 60

  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.15.1@sha256:186f9fe791158ef25d6f810109746ac0acdb35cb8401b554526c77c065483373
    command:
      - -label=tenant_id
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
      - -internal-listen-address=127.0.0.1:8081
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/metrics"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    volumes:
      - ../stackr/deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1::3100"

  # Supabase Auth, as local Supabase runs it, without the rest of Supabase: the test application
  # serves it at /auth/v1. It signs HS256 tokens with the secret the application verifies.
  gotrue:
    profiles: [bdd]
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    environment:
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:auth@auth-db:5432/postgres
      # Where people reach it: through the test application, at /auth/v1.
      API_EXTERNAL_URL: http://localhost/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_SITE_URL: http://localhost
      GOTRUE_JWT_SECRET: *secret
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    # Its migrations have run once it answers.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    profiles: [bdd]
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_PASSWORD: auth
    volumes:
      - ./tests/app/auth.sql:/docker-entrypoint-initdb.d/auth.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
