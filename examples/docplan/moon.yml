# docplan, artifactr's reference implementation.
language: 'python'
layer: 'application'
dependsOn:
  - 'artifactr'
  - 'evalr'

tasks:
  image:
    description: "Build docplan's image from lattice's root, and start it on PostgreSQL"
    command: '$workspaceRoot/scripts/image docplan'
    env:
      COMPOSE_FILE: '../../packages/artifactr/compose.yaml'
      COMPOSE_PROFILES: 'app'
      # Ports the system picks, so it runs beside `pg-up`, `app-up` and other runs.
      DOCPLAN_PORT: '0'
      ARTIFACTR_PG_PORT: '0'
    inputs:
      - 'Dockerfile'
      - '/scripts/image'
      - '/scripts/compose-project.sh'
      - 'Dockerfile.dockerignore'
      - 'README.md'
      - 'pyproject.toml'
      - 'src/**/*'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/packages/*/pyproject.toml'
      - '/examples/*/pyproject.toml'
      - '/packages/artifactr/compose.yaml'
      - '/packages/artifactr/README.md'
      - '/packages/artifactr/LICENSE'
      - '/packages/artifactr/src/**/*'
      - '/packages/evalr/README.md'
      - '/packages/evalr/LICENSE'
      - '/packages/evalr/src/**/*'
      - '/packages/lattice-core/README.md'
      - '/packages/lattice-core/LICENSE'
      - '/packages/lattice-core/src/**/*'
