\* A pull request's run: liveness when a process dies, as it holds the thread or as it asks, with
\* callers that ask again. A refused claimant looks again once the claim could have lapsed, and a
\* process that starts again sweeps the thread (ADR-0070), so nothing asked is stranded. No fault,
\* which ThreadClaimLive.cfg adds at a cost too great to pay beside a crash.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    MaxLog = 2
    MaxReq = 1
    MaxPauses = 1
    TTL = 1
    MaxCrashes = 1
    MaxFaults = 0
    Stalls = FALSE
    Retries = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    AskedIsTaken
    SentIsTaken
