[project]
name = "evalr"
version = "0.1.0.dev0"
description = "Typed evaluation of agent systems: DSPy judges optimized with GEPA, TypeSafe Jev decision models, datasets and experiments in Langfuse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "evaluation", "evals", "dspy", "gepa", "pydantic", "langfuse"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13",
    "annotated-types>=0.6.0",
    "opentelemetry-api>=1.30",
]

[project.optional-dependencies]
dspy = ["dspy>=3.4"]
jev = ["pydantic-ai-slim[typesafe]>=2.51"]
langfuse = ["langfuse>=4.15"]
hf = ["datasets>=5.0", "huggingface-hub>=0.25.0"]
all = ["evalr[dspy,jev,langfuse,hf]"]

[project.urls]
Homepage = "https://evalr.alexnodeland.com"
Documentation = "https://evalr.alexnodeland.com"
Repository = "https://github.com/alexnodeland/evalr"
Issues = "https://github.com/alexnodeland/evalr/issues"
Changelog = "https://github.com/alexnodeland/evalr/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "hypothesis>=6.168",
    "opentelemetry-sdk>=1.30",
    # Reference implementations the metrics are property-tested against.
    "scipy>=1.16",
    "scikit-learn>=1.7",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "pre-commit>=4.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # backoff (a Langfuse dependency, unmaintained since 2.2.1 in 2022) calls
    # asyncio.iscoroutinefunction, which Python 3.14 deprecates. As an error, the warning would
    # stop Langfuse's background uploads in the tests; outside them Python ignores it.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff",
]

[tool.coverage.run]
branch = true
source = ["src/evalr"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
