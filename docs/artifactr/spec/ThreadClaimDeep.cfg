    Procs = {p1, p2}
    MaxLog = 3
    MaxReq = 1
    MaxPauses = 1
    TTL = 2
    MaxCrashes = 0
    MaxFaults = 0
    Stalls = FALSE
    Retries = FALSE
INVARIANTS
    TypeOK
    I1_ConsumedAtMostOnce
    I1_NoneSkipped
    I1_GivenOnce
    I3_ClaimHasATask
    I3_NoStrandedAsk
    I3_OneActiveRun
PROPERTIES
