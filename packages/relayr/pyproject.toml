[project]
name = "relayr"
version = "0.1.0.dev0"
description = "The bridge between artifactr and reflexr: events from chats and artifacts become events for rules, and runs act back in the chat as proposals and notices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "events", "rules", "collaboration", "artifacts", "pydantic-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "artifactr-ai>=0.1.0",
    "reflexr>=0.1.0.dev0",
]

[project.optional-dependencies]
sql = ["sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]
sqlite = ["relayr[sql]", "aiosqlite>=0.22"]
postgres = ["relayr[sql]", "asyncpg>=0.31"]

[project.urls]
Homepage = "https://relayr.alexnodeland.com"
Documentation = "https://relayr.alexnodeland.com"
Repository = "https://github.com/alexnodeland/relayr"
Issues = "https://github.com/alexnodeland/relayr/issues"
Changelog = "https://github.com/alexnodeland/relayr/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
docs = [
    "zensical>=0.0.66",
    "mkdocstrings-python>=2.0.9",
    "griffe-pydantic>=1.3.1",
    "mdx-truly-sane-lists>=1.3",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    "pre-commit>=4.6",
    "git-cliff>=2.14",
]

# The libraries are not on PyPI: they install from GitHub, pinned by commit, and evalr comes
# with them at the commit their own sources pin (ADR-0012).
[tool.uv.sources]
artifactr-ai = { git = "https://github.com/alexnodeland/artifactr", rev = "22d3a1496a9e62012f01da68656ae089026d2a2c" }
reflexr = { git = "https://github.com/alexnodeland/reflexr", rev = "34b9390af74e3381f089b12d7fba086fa0d2f4b3" }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# ─── lint and format ──────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET",
    "PT", "ASYNC", "PERF", "ARG", "T20", "ERA",
]
ignore = [
    "D105", # magic methods document themselves
    "D107", # __init__ is documented on the class
    "N818", # exceptions are named for what happened, as the libraries' are, not with an Error suffix
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/relayr"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
