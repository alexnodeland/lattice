# Dashboards from files: each directory under /var/lib/grafana/dashboards is a
# folder. compose.yaml mounts stackr's, and the libraries', from lattice's
# packages/<library>/deploy/grafana/dashboards.
apiVersion: 1

providers:
  - name: stackr
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
