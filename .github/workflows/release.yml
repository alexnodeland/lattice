# Releases (stackr's RFC-0003, Releases and versioning). release-please keeps one release pull
# request open for the packages with unreleased changes. Merging it tags each one
# <package>-v<version>, updates its CHANGELOG.md and creates its GitHub release. Each released
# package that ships a wheel is then built alone, as it is published, and its wheel and sdist are
# attached to its release with a build-provenance attestation. Publishing to PyPI is a later job
# here. A stackr release also publishes the AWS recipe's thin images to GHCR (stackr ADR-0035):
# built natively for amd64 and arm64, then pushed as one multi-arch image per version, attested,
# by the one job that may write packages.
#
# release-please acts as lattice's GitHub App, with a token minted for each run and narrowed to
# what it needs, so that its pull request's CI and Title checks run, which they never do for the
# workflow's own token. The App's client ID and private key are the LATTICE_APP_CLIENT_ID and
# LATTICE_APP_PRIVATE_KEY secrets; renovate.yml acts as the same App.

name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      packages: ${{ steps.wheels.outputs.packages }}
      releases: ${{ toJSON(steps.release.outputs) }}
      stackr: ${{ steps.release.outputs['packages/stackr--release_created'] && steps.release.outputs['packages/stackr--version'] || '' }}
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LATTICE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LATTICE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The released packages that ship a wheel: all of them but stackr.
      - id: wheels
        env:
          RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        run: echo "packages=$(jq --compact-output 'map(select(. != "packages/stackr"))' <<<"$RELEASED")" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.path }})
    needs: release-please
    if: needs.release-please.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.packages) }}
    env:
      TAG: ${{ fromJSON(needs.release-please.outputs.releases)[format('{0}--tag_name', matrix.path)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
        with:
          cache: false # a publishing job restores no cache
      # portalr's wheel carries its two UIs, which Vite builds into its source first.
      - name: Build portalr's UIs
        if: matrix.path == 'packages/portalr'
        run: |
          bun install --frozen-lockfile
          moon run app:build admin:build
      - name: Build the package alone, as it is published
        working-directory: ${{ matrix.path }}
        run: uv build --no-sources --out-dir dist
      - name: Check portalr's wheel carries its UIs
        if: matrix.path == 'packages/portalr'
        working-directory: ${{ matrix.path }}
        run: uv run --no-project python scripts/check_wheel.py
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.path }}/dist/*
      - name: Attach the wheel and sdist to the release
        working-directory: ${{ matrix.path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*

  # Each thin image for each architecture, on a runner of that architecture, saved as an OCI
  # archive: nothing here can write to the registry.
  image:
    name: Image (${{ matrix.image }}, ${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.stackr != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        image: [otel-collector, tempo, loki, pyroscope, grafana, litellm, db-init, auth-keys]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image as an OCI archive
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release-please.outputs.stackr }}
        run: |
          # The same bytes from the same commit: every time in the image is the commit's.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker buildx create --use >/dev/null
          docker buildx build --platform "linux/$ARCH" --file "packages/stackr/deploy/$IMAGE/Dockerfile" \
            --label org.opencontainers.image.source=https://github.com/alexnodeland/lattice \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.description=stackr's $IMAGE, for its AWS recipe" \
            --output "type=oci,dest=stackr-$IMAGE-$ARCH.tar,rewrite-timestamp=true" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackr-${{ matrix.image }}-${{ matrix.arch }}
          path: stackr-${{ matrix.image }}-${{ matrix.arch }}.tar
          retention-days: 1

  # The one job that writes packages: it pushes each architecture's image, joins them under the
  # release's version, and attests the result, with its provenance in the registry.
  publish-images:
    name: Publish (${{ matrix.image }})
    needs: [release-please, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [otel-collector, tempo, loki, pyroscope, grafana, litellm, db-init, auth-keys]
    env:
      REPOSITORY: ghcr.io/alexnodeland/stackr-${{ matrix.image }}
      VERSION: ${{ needs.release-please.outputs.stackr }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stackr-${{ matrix.image }}-*
          merge-multiple: true
      - name: Push each architecture, then the release's version
        id: push
        env:
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          for arch in amd64 arm64; do
            skopeo copy --digestfile "$arch.digest" "oci-archive:stackr-$IMAGE-$arch.tar" \
              "docker://$REPOSITORY:$VERSION-$arch"
          done
          docker buildx imagetools create --tag "$REPOSITORY:$VERSION" \
            "$REPOSITORY@$(cat amd64.digest)" "$REPOSITORY@$(cat arm64.digest)"
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$REPOSITORY:$VERSION@$digest" >>"$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
          skopeo logout ghcr.io
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
