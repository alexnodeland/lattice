# grantr: identity and access for artifactr and reflexr. It imports neither, nor any sibling but
# lattice-core.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn:
  - 'lattice-core'

tasks:
  schema:
    description: "Regenerate the admin API's OpenAPI document from the router"
    script: 'uv run python -m grantr.fastapi.openapi > schemas/grantr.openapi.json'
    options:
      cache: false
      runInCI: false

  pg-up:
    description: 'Start PostgreSQL for the SQL tests, from compose.yaml, on port 54331'
    command: 'docker compose up -d --wait postgres'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop PostgreSQL'
    command: 'docker compose down'
    options:
      cache: false
      runInCI: false

  # $GRANTR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
  # always sets it, so every pull request would run these tests. CI never restores moon's cache;
  # locally, `moon run grantr:test --force` runs the PostgreSQL tests past a cached run without
  # them.
  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    command: 'uv run pytest --cov --cov-report=term-missing'
    env:
      GRANTR_TEST_POSTGRES_URL: 'postgresql+asyncpg://postgres:grantr@localhost:54331/postgres'
    options:
      cache: false
      runInCI: false
