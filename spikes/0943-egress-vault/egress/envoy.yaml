# Envoy 1.40.2 for spike #943. Four forward-proxy listeners, one per approach:
#   10000 odst    ext_authz -> router -> ORIGINAL_DST cluster addressed by the authorizer's
#                 x-lattice-upstream header ("a cluster addressed by the authorizer's answer")
#   10001 dfp     ext_authz -> dynamic_forward_proxy -> router: the control, Envoy resolves again
#   10002 cred    as odst, but the cluster originates TLS (auto SNI and SAN from Host), and the
#                 authorizer injects the credential: question 2
#   10003 dfpin   ext_authz -> set_filter_state (envoy.upstream.dynamic_host = the checked IP)
#                 -> dynamic_forward_proxy: the DNS cache fed only the authorizer's answer
#   10004 tunnel  CONNECT, ext_authz -> ORIGINAL_DST: a tunnel (no injection) for registries
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}

x-authz: &authz
  name: envoy.filters.http.ext_authz
  typed_config: &authz_config
    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
    failure_mode_allow: false
    allowed_headers:
      patterns: [{exact: proxy-authorization}, {exact: x-lattice-secret}]
    http_service: &authz_service
      server_uri: {uri: "http://198.18.94.10:9000", cluster: authz, timeout: 2s}
      path_prefix: /odst
      authorization_response:
        allowed_upstream_headers:
          patterns:
            - {exact: x-lattice-upstream}
            - {exact: x-lattice-upstream-ip}
            - {exact: authorization}
        dynamic_metadata_from_headers:
          patterns: [{prefix: x-lattice-}]

x-log: &log
  name: envoy.access_loggers.stdout
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
    log_format:
      json_format:
        listener: "%DOWNSTREAM_LOCAL_PORT%"
        method: "%REQ(:METHOD)%"
        authority: "%REQ(:AUTHORITY)%"
        code: "%RESPONSE_CODE%"
        flags: "%RESPONSE_FLAGS%"
        upstream_host: "%UPSTREAM_HOST%"
        checked: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-lattice-checked)%"
        tenant: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-lattice-tenant)%"
        workspace: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-lattice-workspace)%"
        purpose: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:x-lattice-purpose)%"
        bytes_sent: "%BYTES_SENT%"
        duration_ms: "%DURATION%"

x-cares: &cares
  name: envoy.network.dns_resolver.cares
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
    resolvers: [{socket_address: {address: 198.18.94.53, port_value: 53}}]
    use_resolvers_as_fallback: false

x-cache1: &cache1
  name: cache1
  dns_lookup_family: V4_ONLY
  typed_dns_resolver_config: *cares

x-cache2: &cache2
  name: cache2
  dns_lookup_family: V4_ONLY
  typed_dns_resolver_config: *cares

static_resources:
  listeners:
    - name: odst
      address: {socket_address: {address: 0.0.0.0, port_value: 10000}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: odst
                access_log: [*log]
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes: [{match: {prefix: /}, route: {cluster: odst}}]
                http_filters:
                  - *authz
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}

    - name: dfp
      address: {socket_address: {address: 0.0.0.0, port_value: 10001}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: dfp
                access_log: [*log]
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes: [{match: {prefix: /}, route: {cluster: dfp}}]
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      <<: *authz_config
                      http_service:
                        <<: *authz_service
                        path_prefix: /dfp
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config: *cache1
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}

    - name: cred
      address: {socket_address: {address: 0.0.0.0, port_value: 10002}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cred
                access_log: [*log]
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: {prefix: /}
                          route: {cluster: odst_tls}
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      <<: *authz_config
                      http_service:
                        <<: *authz_service
                        path_prefix: /cred
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router, suppress_envoy_headers: true}

    - name: dfpin
      address: {socket_address: {address: 0.0.0.0, port_value: 10003}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: dfpin
                access_log: [*log]
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes: [{match: {prefix: /}, route: {cluster: dfp2}}]
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      <<: *authz_config
                      http_service:
                        <<: *authz_service
                        path_prefix: /dfpin
                  - name: envoy.filters.http.set_filter_state
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
                      on_request_headers:
                        - object_key: envoy.upstream.dynamic_host
                          format_string: {text_format_source: {inline_string: "%REQ(x-lattice-upstream-ip)%"}}
                        - object_key: envoy.upstream.dynamic_port
                          format_string: {text_format_source: {inline_string: "80"}}
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config: *cache2
                      allow_dynamic_host_from_filter_state: true
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}

    - name: tunnel
      address: {socket_address: {address: 0.0.0.0, port_value: 10004}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tunnel
                access_log: [*log]
                upgrade_configs: [{upgrade_type: CONNECT}]
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: {connect_matcher: {}}
                          route:
                            cluster: odst
                            upgrade_configs: [{upgrade_type: CONNECT, connect_config: {}}]
                http_filters:
                  # gRPC, not HTTP: the HTTP service sends a CONNECT's check as a CONNECT, which
                  # Envoy's own async client fails (503, ext_authz_error, 403 to the caller).
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: {cluster_name: authz_grpc}
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}

  clusters:
    - name: authz
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: authz
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: 198.18.94.10, port_value: 9000}}}

    - name: authz_grpc
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: {http2_protocol_options: {}}
      load_assignment:
        cluster_name: authz_grpc
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: 198.18.94.11, port_value: 9001}}}

    - name: odst
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      connect_timeout: 2s
      original_dst_lb_config:
        use_http_header: true
        http_header_name: x-lattice-upstream

    - name: odst_tls
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      connect_timeout: 2s
      original_dst_lb_config:
        use_http_header: true
        http_header_name: x-lattice-upstream
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          upstream_http_protocol_options: {auto_sni: true, auto_san_validation: true}
          explicit_http_config: {http_protocol_options: {}}
          # Upstream filters run after the host is chosen: strip the routing headers here.
          # (A route's request_headers_to_remove runs before, and leaves ORIGINAL_DST nothing.)
          http_filters:
            - name: envoy.filters.http.header_mutation
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                mutations:
                  request_mutations:
                    - remove: x-lattice-upstream
                    - remove: x-lattice-upstream-ip
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            validation_context:
              trusted_ca: {filename: /certs/ca.crt}

    - name: dfp
      lb_policy: CLUSTER_PROVIDED
      connect_timeout: 2s
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: *cache1

    - name: dfp2
      lb_policy: CLUSTER_PROVIDED
      connect_timeout: 2s
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: *cache2
