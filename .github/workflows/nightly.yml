# Every night: every project's checks, whatever changed, the formal specs at their deeper bounds,
# the reference implementations' images, osv-scanner over the lockfiles, and a check of the links
# in the Markdown. On each push to main, only what no pull request ran: the toolchain's caches,
# the crafting apps' fidelity, a release image's reproducibility and the links. CI runs on pull
# requests only, and the merge queue's draft of a push to main ran the rest on the same tree.

name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

# A push to main cancels the run of the push before it, never the night's: a tier-2 run cancelled
# mid-apply would leave its Floci to its own cleanup.
concurrency:
  group: nightly-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The jobs that save main's caches of ~/.proto (ADR-0017), which every other job restores: one
  # for each architecture, once proto has cleaned out what nothing uses. Every run, so the caches
  # stay fresh whichever of the jobs below ran.
  toolchain:
    name: Toolchain (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
        id: toolchain
      - name: Clean ~/.proto for the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: proto clean --yes
      - name: Save proto and its tools
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.proto
          key: ${{ steps.toolchain.outputs.cache-key }}

  check:
    name: Check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ARTIFACTR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/artifactr
      REFLEXR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/reflexr
      GRANTR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/grantr
      RELAYR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/relayr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - name: One database per library
        env:
          PGPASSWORD: lattice
        run: psql -h localhost -U postgres -c 'CREATE DATABASE artifactr' -c 'CREATE DATABASE reflexr' -c 'CREATE DATABASE grantr' -c 'CREATE DATABASE relayr'
      - run: uv sync --locked --all-packages --all-groups --all-extras
      - run: bun install --frozen-lockfile
      - run: bun x --bun --no-install playwright install --with-deps --only-shell chromium
        working-directory: packages/portalr/web/ui
      # Every project's checks, batched as CI's are: each browser project's first, one after
      # another, apart from the containers other tests start (ADR-0002), and then the rest. Run
      # together, three Chromium suites on one runner made the phone tests miss their 15 s (#875).
      - run: uv run --no-project python scripts/affected.py check --all

  images:
    name: Images
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: moon run :image

  # Each crafting app's fidelity (lattice RFC-0003, phase 2): its pinned CLI opens and saves each
  # file of its corpus, and the matrix of what it kept, feature by feature, is the run's summary;
  # and the agent creates a blank file through its worker, which opens, and proposes a first edit.
  # The apps are those with a corpus and those the stackr template wires, which tests hold this
  # list to.
  fidelity:
    name: Fidelity (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          [blender, cadcraft, deckcraft, designcraft, effectcraft, figcraft, filmcraft, freecad,
           gridcraft, pdfcraft, photocraft, soundcraft, vectorcraft, wordcraft]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: uv sync --locked --all-packages --all-groups --all-extras
      # The X11 and GL libraries Blender's tarball links, as its worker's image installs them
      # (stackr's copier.yml): without libEGL it starts, reads a scene and dies drawing it (#783).
      - name: Blender's libraries
        if: matrix.app == 'blender'
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6
          libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri
      - run: moon run artifactr:fidelity
        env:
          CRAFT: ${{ matrix.app }}
          CRAFT_MATRIX: ${{ github.workspace }}/fidelity.md
      - name: The matrix
        if: always()
        run: if [[ -f fidelity.md ]]; then cat fidelity.md >>"$GITHUB_STEP_SUMMARY"; fi

  # TLC over the formal specs (ADR-0025): the pull request's configurations, and the deeper ones.
  specs:
    name: Specs
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: moon run :spec :spec-deep

  # stackr's thin images, on both architectures, as CI builds them when they change.
  thin-images:
    name: Thin images (${{ matrix.arch }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: moon run stackr:images

  # A stackr release's images are reproducible (stackr ADR-0035): auth-keys, whose .pyc files
  # are the likeliest to differ, built twice from the same commit without a cache, to one digest.
  reproducible-image:
    name: Reproducible image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: bash
        env:
          NO_CACHE: "1"
        run: |
          for build in first second; do
            packages/stackr/deploy/image-archive amd64 0.0.0-nightly "$build" auth-keys
          done
          first=$(tar --extract --to-stdout --file first/stackr-auth-keys-amd64.tar index.json | jq --raw-output '.manifests[0].digest')
          second=$(tar --extract --to-stdout --file second/stackr-auth-keys-amd64.tar index.json | jq --raw-output '.manifests[0].digest')
          echo "first: $first, second: $second"
          # Two digests, each a digest: two empty answers would match too.
          [[ $first =~ ^sha256:[0-9a-f]{64}$ && $second =~ ^sha256:[0-9a-f]{64}$ && $first == "$second" ]]

  # stackr's AWS recipe, tier 2 (stackr ADR-0036), against Floci on arm64: every night, and when
  # run by hand, but not on each push to main, which CI ran it for when the recipe changed.
  aws-tier2:
    name: AWS (tier 2)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: proto trust .prototools && proto install tofu
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: opentofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/stackr/deploy/aws/**/.terraform.lock.hcl') }}
      - run: moon run stackr:aws-tier2

  # stackr's AWS recipe, tier 1, as CI runs it when the recipe changes. Here to save the OpenTofu
  # providers' cache, which pull requests only restore: x64's, as tier 2 above saves arm64's.
  aws:
    name: AWS (tier 1)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: proto trust .prototools && proto install tofu && proto install tflint
      - id: providers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: opentofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/stackr/deploy/aws/**/.terraform.lock.hcl') }}
      - run: moon run stackr:aws
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Saved even if the checks failed: the providers are downloaded by then, and a failing night
      # would otherwise leave every pull request without them.
      - if: always() && steps.providers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ steps.providers.outputs.cache-primary-key }}

  # Every lockfile git doesn't ignore: uv.lock and bun.lock.
  osv:
    name: OSV
    if: github.event_name != 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        # Most of the ~2,900 links are GitHub's, and sent all at once GitHub answers a few with a
        # 502 or 503. Pace them, a few at a time and five a second at most, and retry each failure
        # for about a minute before counting it.
        with:
          args: >-
            --no-progress --exclude-loopback --host-concurrency 4 --host-request-interval 200ms
            --max-retries 5 --retry-wait-time 10 './**/*.md'
        env:
          GITHUB_TOKEN: ${{ github.token }}
