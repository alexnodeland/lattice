# The contributor stack: PostgreSQL for grantr's SQL tests, and nothing else.
#
#   docker compose up -d --wait              (moon run grantr:pg-up)

name: grantr

services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_PASSWORD: grantr
    ports:
      - "127.0.0.1:${GRANTR_PG_PORT:-54331}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
