# @portalr/ui: the brand tokens, the primitives, and the chat and artifact components.
language: 'typescript'
layer: 'library'
# Its chat renders client's store, whose types alone it imports (portalr ADR-0015).
dependsOn:
  - 'client'
workspace:
  inheritedTasks:
    exclude: ['build'] # its source is built into app and admin

tasks:
  # Chromium's headless shell for Playwright, with what it needs of the system, for app's and
  # admin's scenarios: one task, so the two never install it at once.
  chromium:
    description: 'Install Chromium for the scenarios'
    command: 'bun x --bun --no-install playwright install --with-deps --only-shell chromium'
    options:
      cache: false
