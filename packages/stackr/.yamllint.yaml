extends: default

ignore: |
  .venv/
  node_modules/

rules:
  document-start: disable
  line-length:
    max: 120
    level: warning
    # An image pinned by tag and digest is one word too long to break.
    allow-non-breakable-inline-mappings: true
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent
