# The merge queue (lattice ADR-0016). A pull request labelled `queue` is
# brought up to date with main, checked again, and squash-merged; the
# ruleset's required checks, CI and Title, are Mergify's merge conditions.
# The ruleset requires branches up to date with main, so the queue checks
# each pull request in place, one at a time, rather than in draft pull requests.
queue_rules:
  - name: default
    batch_size: 1
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
    queue_conditions:
      - base = main
      - label = queue
      - -draft

merge_queue:
  max_parallel_checks: 1

merge_protections_settings:
  auto_merge_conditions:
    - label = queue
