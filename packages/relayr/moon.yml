# relayr, distributed as relayr-ai: the bridge between artifactr and reflexr.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn:
  - 'artifactr'
  - 'evalr'
  - 'lattice-core'
  - 'reflexr'

tasks:
  schema:
    description: "Regenerate the OpenAPI document of relayr's routes, which portalr's client is typed from"
    script: 'uv run python -m relayr.fastapi.openapi > schemas/relayr.openapi.json'
    options:
      cache: false
      runInCI: false

  pg-up:
    description: 'Start PostgreSQL for the SQL tests, from compose.yaml, on port 54332'
    command: 'docker compose up -d --wait postgres'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop the contributor stack: PostgreSQL, and Vikunja if it runs'
    command: 'docker compose --profile trackers down'
    options:
      cache: false
      runInCI: false

  # $RELAYR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
  # always sets it, so every pull request would run these tests. CI never restores moon's cache;
  # locally, `moon run relayr:test --force` runs the PostgreSQL tests past a cached run without
  # them.
  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    command: 'uv run pytest --cov --cov-report=term-missing'
    env:
      RELAYR_TEST_POSTGRES_URL: 'postgresql+asyncpg://postgres:relayr@localhost:54332/postgres'
    options:
      cache: false
      runInCI: false

  vikunja-up:
    description: 'Start Vikunja for the tracker contract test, live, from compose.yaml, on port 54333'
    command: 'docker compose --profile trackers up -d --wait vikunja'
    options:
      cache: false
      runInCI: false

  # With RELAYR_RECORD=1 as well, the live exchanges replace tests/trackers/fixtures/vikunja.
  test-vikunja:
    description: 'Run the tracker contract test against Vikunja, live (after vikunja-up)'
    command: 'uv run pytest tests/trackers/test_contract.py'
    env:
      RELAYR_TEST_VIKUNJA_URL: 'http://localhost:54333'
    options:
      cache: false
      runInCI: false
