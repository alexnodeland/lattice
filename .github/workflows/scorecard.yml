# OpenSSF Scorecard (stackr's RFC-0003, CI and tooling: supply chain), every week, on main: it
# scores the repository's practices (pinned dependencies, token permissions, branch protection,
# code review, and the rest), publishes the result to the OpenSSF's public API, and uploads its
# findings to the repository's code scanning. The scorecard action checks that this workflow
# stays publishable: no top-level env or defaults, and only the actions it allows in this job.

name: Scorecard

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Signs the result that publish_results sends to the OpenSSF.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
