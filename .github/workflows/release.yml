# Releases (stackr's RFC-0003, Releases and versioning). release-please keeps one release pull
# request open for the packages with unreleased changes. Merging it tags each one
# <package>-v<version>, updates its CHANGELOG.md and creates its GitHub release. Each released
# package that ships a wheel is then built alone, as it is published, and its wheel and sdist are
# attached to its release with a build-provenance attestation. Publishing to PyPI is a later job
# here. A stackr release also publishes the AWS recipe's thin images to GHCR (stackr ADR-0035):
# built natively for amd64 and arm64 from the release's commit, then pushed as one multi-arch
# image per version and attested, by the one job that may write packages; the images' references
# are then added to the release's notes. CI runs the same scripts, against a registry of its own.
#
# release-please acts as lattice's GitHub App, with a token minted for each run and narrowed to
# what it needs, so that its pull request's CI and Title checks run, which they never do for the
# workflow's own token. The App's client ID and private key are the LATTICE_APP_CLIENT_ID and
# LATTICE_APP_PRIVATE_KEY secrets; renovate.yml acts as the same App.

name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      packages: ${{ steps.wheels.outputs.packages }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LATTICE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LATTICE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Every released package needs a full commit sha in the outputs, which the jobs below check
      # out: a checkout given no ref uses this push's commit, which they must not build from. So
      # this fails the workflow without one. The release exists by now, so running the workflow
      # again finds it made, builds nothing, and leaves a tagged release with no wheels: they
      # would then be built by hand from the tag.
      # RELEASES holds every output, each release's notes too, and an environment variable on
      # Linux is capped near 128 KB: past that this step can't start, and the workflow fails.
      - name: Require a commit for every released package
        env:
          RELEASES: ${{ toJSON(steps.release.outputs) }}
          RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        run: |
          jq --exit-status --argjson paths "$RELEASED" \
            '. as $outputs | [$paths[] | ($outputs[. + "--sha"] // "") | test("^[0-9a-f]{40}$")] | all' \
            <<<"$RELEASES" >/dev/null ||
            { echo "release-please gave a released package no commit: $RELEASED" >&2; exit 1; }
      # The released packages that ship a wheel: all of them but stackr.
      - id: wheels
        env:
          RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        run: echo "packages=$(jq --compact-output 'map(select(. != "packages/stackr"))' <<<"$RELEASED")" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.path }})
    needs: release-please
    if: needs.release-please.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.packages) }}
    env:
      TAG: ${{ fromJSON(needs.release-please.outputs.releases)[format('{0}--tag_name', matrix.path)] }}
    steps:
      # The commit release-please tagged for this package, not the push that ran the workflow: they
      # differ when release-please creates the release on a later push than the one that merged its
      # pull request. The toolchain action and portalr's check_wheel.py below come from that
      # commit too. The attestation names the workflow's own commit, the push: see #206.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.releases)[format('{0}--sha', matrix.path)] }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
        with:
          cache: false # a publishing job restores no cache
      # portalr's wheel carries its two UIs, which Vite builds into its source first.
      - name: Build portalr's UIs
        if: matrix.path == 'packages/portalr'
        run: |
          bun install --frozen-lockfile
          moon run app:build admin:build
      - name: Build the package alone, as it is published
        working-directory: ${{ matrix.path }}
        run: uv build --no-sources --out-dir dist
      - name: Check portalr's wheel carries its UIs
        if: matrix.path == 'packages/portalr'
        working-directory: ${{ matrix.path }}
        run: uv run --no-project python scripts/check_wheel.py
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.path }}/dist/*
      - name: Attach the wheel and sdist to the release
        working-directory: ${{ matrix.path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*

  # Each architecture's thin images, on a runner of that architecture, from the release's commit,
  # saved as OCI archives: nothing here can write to the registry.
  image:
    name: Images (${{ matrix.arch }})
    needs: release-please
    if: fromJSON(needs.release-please.outputs.releases)['packages/stackr--release_created'] == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      images: ${{ steps.images.outputs.images }}
    env:
      VERSION: ${{ fromJSON(needs.release-please.outputs.releases)['packages/stackr--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.releases)['packages/stackr--sha'] }}
          persist-credentials: false
      - id: images
        run: |
          images=$(packages/stackr/deploy/image-archive --list)
          echo "images=$images" >>"$GITHUB_OUTPUT"
      - name: Build each image as an OCI archive
        env:
          ARCH: ${{ matrix.arch }}
        run: packages/stackr/deploy/image-archive "$ARCH" "$VERSION" archives
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackr-images-${{ matrix.arch }}
          path: archives/
          retention-days: 7
          compression-level: 0
          overwrite: true

  # The one job that writes packages: it pushes each architecture's image, joins them under the
  # release's version, and attests the result, with its provenance in the registry. Re-running it
  # within the archives' seven days publishes the same images again.
  publish-images:
    name: Publish (${{ matrix.image }})
    needs: [release-please, image]
    if: fromJSON(needs.release-please.outputs.releases)['packages/stackr--release_created'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.image.outputs.images) }}
    env:
      REPOSITORY: ghcr.io/alexnodeland/stackr-${{ matrix.image }}
      VERSION: ${{ fromJSON(needs.release-please.outputs.releases)['packages/stackr--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.releases)['packages/stackr--sha'] }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stackr-images-*
          path: archives
          merge-multiple: true
      - name: Push each architecture, then the release's version
        id: push
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          reference=$(packages/stackr/deploy/publish-image "$IMAGE" "$VERSION" "$REPOSITORY" archives)
          echo "digest=${reference##*@}" >>"$GITHUB_OUTPUT"
          echo "- \`$reference\`" | tee "$IMAGE.md" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackr-reference-${{ matrix.image }}
          path: ${{ matrix.image }}.md
          retention-days: 7
          overwrite: true

  # The published references, by version and digest, added to the release's notes, for envs/prod:
  # a job of its own, which may write the release and nothing in the registry.
  release-notes:
    name: Images in the release's notes
    needs: [release-please, publish-images]
    if: fromJSON(needs.release-please.outputs.releases)['packages/stackr--release_created'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stackr-reference-*
          path: references
          merge-multiple: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ fromJSON(needs.release-please.outputs.releases)['packages/stackr--tag_name'] }}
        run: |
          # The notes as release-please wrote them, without a section this job added before: run
          # again, it replaces its own. Never edited from an empty read.
          marker='<!-- stackr: images -->'
          body=$(gh release view "$TAG" --json body --jq .body)
          body=$(printf '%s\n' "$body" | tr -d '\r' | sed "/^$marker\$/,\$d")
          if [[ -z ${body//[[:space:]]/} ]]; then
            echo "release-notes: $TAG's notes read as empty; nothing edited" >&2
            exit 1
          fi
          {
            printf '%s\n\n%s\n### Images\n\nFor envs/prod, by version and digest:\n\n' "$body" "$marker"
            sort references/*.md
          } >notes.md
          gh release edit "$TAG" --notes-file notes.md
