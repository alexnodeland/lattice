[project]
name = "portalr"
version = "0.10.0"
description = "The portal into an application built on lattice: an app UI to chat with its agents and see their work, and an admin UI to manage access and see feedback, evaluations, usage and spend."
readme = "README.md"
license = "MIT AND OFL-1.1 AND Apache-2.0 AND ISC AND BSD-3-Clause AND 0BSD AND CC0-1.0 AND Zlib"
# The licences of lattice, the typefaces and Tremor's charts, and those the bundled JavaScript is
# used under (web/notices). `portalr:licence-expression` keeps the expression to what the UIs'
# generated notices say is bundled.
# The UIs carry lattice's two typefaces, and app carries Excalidraw's, under the SIL Open Font
# License (web/ui/licenses/excalidraw-faces.txt, which says what is not), and charts
# adapted from Tremor's, under the Apache License (web/ui/NOTICE). They bundle third-party JavaScript,
# whose licences each UI's build collects into THIRD-PARTY-NOTICES.txt beside its files
# (web/notices). That file is generated and not committed, so it isn't listed here (a glob that
# matches nothing is invalid metadata, for every install that hasn't built the UIs): the wheel
# carries it with the UIs, not in dist-info/licenses, and `ui-in-wheel` checks it.
license-files = [
  "LICENSE",
  "web/ui/src/fonts/OFL-*.txt",
  "web/ui/NOTICE",
  "web/ui/licenses/*.txt",
]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "portal", "admin", "observability", "fastapi", "react"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "grantr[fastapi]>=0.2.0",
    "lattice-core-ai>=0.2.0",
    "fastapi>=0.141",
    "httpx>=0.28",
    "opentelemetry-api>=1.45",
    "pydantic>=2.13",
    "starlette>=0.46.0",
]

[project.optional-dependencies]
# People's answers to product analytics, in the application's database (lattice RFC-0008).
sql = ["sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]

[project.scripts]
portalr = "portalr.brand.cli:main"

[project.urls]
Homepage = "https://lattice.alexnodeland.com/portalr/"
Documentation = "https://lattice.alexnodeland.com/portalr/"
Repository = "https://github.com/alexnodeland/lattice"
Issues = "https://github.com/alexnodeland/lattice/issues"
Changelog = "https://github.com/alexnodeland/lattice/blob/main/packages/portalr/CHANGELOG.md"

[dependency-groups]
test = [
    "aiosqlite>=0.22",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
# The acceptance tests' application (tests/app/), which its image serves: it verifies Supabase
# Auth's tokens, serves artifactr's and reflexr's streams, and names their actions to grantr, so
# that it lists workspaces and checks every command; its agent asks forms through artifactr.ui;
# and relayr's tracker connector, over a fake tracker, for the tracker's links.
app = [
    "uvicorn>=0.54",
    "websockets>=15",
    "pyjwt>=2.15",
    "artifactr-ai[otel,files,forms]",
    "reflexr[otel]",
    "relayr-ai[fastapi]",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "app" },
]

# In lattice, grantr is the checkout's. A built wheel keeps the range in [project] alone.
[tool.uv.sources]
grantr = { workspace = true }
artifactr-ai = { workspace = true }
reflexr = { workspace = true }
relayr-ai = { workspace = true }
lattice-core-ai = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Vite's manifests, which the size check reads, aren't the UIs' and aren't served (portalr ADR-0044).
[tool.uv.build-backend]
wheel-exclude = ["static/*/.vite"]

# ─── dependencies ─────────────────────────────────────────────────────────────

# deptry can't tell from the workspace's editable install which module lattice-core-ai provides.
[tool.deptry.package_module_name_map]
lattice-core-ai = "lattice_core"

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A test that runs for a minute is stuck: fail it with its stack, as a failure of its own, by
# SIGALRM, so the xdist worker running it carries on (lattice ADR-0007, ADR-0028).
timeout = 60
timeout_method = "signal"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "acceptance: reads the stack's tools, which `moon run portalr:api` starts (sets PORTALR_TEMPO_URL)",
]

[tool.coverage.run]
branch = true
source = ["src/portalr"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
