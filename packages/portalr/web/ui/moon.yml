# @portalr/ui: the brand tokens, the primitives, and the chat and artifact components.
language: 'typescript'
layer: 'library'
# Its tests run in Chromium, which CI keeps apart from other tests' containers (lattice ADR-0002).
tags: ['browser']
# Its chat renders client's store, whose types alone it imports (portalr ADR-0015).
dependsOn:
  - 'client'
workspace:
  inheritedTasks:
    exclude: ['build'] # its source is built into app and admin

tasks:
  # Chromium's headless shell for Playwright, with what it needs of the system, for app's and
  # admin's scenarios: one task, so the two never install it at once.
  chromium:
    description: 'Install Chromium for the scenarios'
    command: 'bun x --bun --no-install playwright install --with-deps --only-shell chromium'
    options:
      cache: false

  test:
    inputs:
      - '**/*'
      # The vectors artifactr.ui commits, which the forms' tests check against (lattice RFC-0005).
      - '/packages/artifactr/tests/ui/vectors/*.json'
      # The schema artifactr.ui's panels are held to, and lattice's integrations and their defaults.
      - '/packages/artifactr/schemas/artifactr_ui.v1.json'
      - '/packages/portalr/schemas/integrations.json'
      # The app's diagram card and canvas, which the CSP tests open (portalr ADR-0072).
      - '/packages/portalr/web/app/excalidraw.ts'
      - '/packages/portalr/web/app/src/diagram*'
      - '/packages/portalr/web/app/src/on-demand/canvas*'
