# The contributor stack (ADR-0030): what developing artifactr needs, and no more.
#
#   docker compose up -d --wait              PostgreSQL for the tests (moon run artifactr:pg-up)
#   docker compose --profile app up -d       and docplan, the reference app, on :8000
#
# The observability and LLM infrastructure (the OpenTelemetry Collector, Grafana, Langfuse and
# LiteLLM) lives in stackr (ADR-0032). When stackr's stack runs, add compose.stackr.yaml to put
# docplan on stackr's network and send its telemetry to stackr's Collector:
#
#   docker compose -f compose.yaml -f compose.stackr.yaml --profile app up -d

name: artifactr

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: artifactr
    ports:
      - "127.0.0.1:${ARTIFACTR_PG_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  docplan:
    profiles: [app]
    build:
      # lattice's root, which holds the one uv.lock.
      context: ../..
      dockerfile: examples/docplan/Dockerfile
    environment:
      DOCPLAN_DATABASE_URL: postgresql+asyncpg://postgres:artifactr@postgres:5432/postgres
      # Passed through from the host when set there.
      DOCPLAN_MODEL:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      DOCPLAN_LITELLM_URL:
      DOCPLAN_LITELLM_MODEL:
      DOCPLAN_LITELLM_KEY:
    ports:
      - "127.0.0.1:${DOCPLAN_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
