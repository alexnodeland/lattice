# stackr: the stack and the application template. It ships no wheel, and its checks are its own,
# so it inherits none of the Python projects' tasks.
language: 'bash'
layer: 'tool'
# The template generates applications on the libraries.
dependsOn:
  - 'artifactr'
  - 'reflexr'
  - 'evalr'

# Its tasks run the workspace's tools, so the lock and the root's configuration are inputs too.
tasks:
  validate:
    description: 'Validate every configuration without starting containers'
    command: 'make validate'
    inputs:
      - '**/*'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/copier.yml'

  reference:
    description: "Check that the documentation's reference pages match the files they describe"
    command: 'uv run scripts/docs-reference --check'
    inputs:
      - '**/*'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/docs/stackr/reference/**/*'

  check:
    description: "Run the project's checks, as CI does"
    command: 'noop'
    deps:
      - 'validate'
      - 'reference'

  # CI's Template and Smoke jobs, with their matrix values in the environment.
  template:
    description: 'Generate one application from the template and run its own checks'
    command: 'scripts/check-app'
    inputs:
      - '**/*'
      - '/copier.yml'
      - '/uv.lock'
      - '$TEMPLATE_LIBRARIES'
      - '$TEMPLATE_EVALS'
      - '$TEMPLATE_PYTHON'
    options:
      cache: false

  smoke:
    description: 'Start the stack (PROFILES, STACKR_DATABASE) and send telemetry through it'
    script: 'make up && make smoke'
    options:
      cache: false

  smoke-app:
    description: 'Run an application from the template beside the running stack'
    command: 'make smoke-app'
    options:
      cache: false
