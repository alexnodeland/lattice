# The contributor stack: PostgreSQL for grantr's SQL tests, and nothing else.
#
#   docker compose up -d --wait              (moon run grantr:pg-up)

name: grantr

services:
  postgres:
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_PASSWORD: grantr
    ports:
      - "127.0.0.1:${GRANTR_PG_PORT:-54331}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
