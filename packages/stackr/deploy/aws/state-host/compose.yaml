# The AWS recipe's state host (RFC-0004): ClickHouse, Prometheus and prom-label-proxy, the services
# that need a disk that outlives a task, under Compose and systemd on one EC2 instance, with their
# data on its EBS volume at /data. They are compose.yaml's but for their ports and their data's
# paths on the host, which scripts/check-config holds them to. Each port binds the instance's
# private address, STATE_HOST_ADDRESS, which only the groups of the services that use it reach.
# ClickHouse's users are deploy/clickhouse/users.xml's, as on one machine (ADR-0031): an admin, and
# Langfuse's, on its own database; and the single host's `backup` user, with a `backups` named
# collection pointed at the backups bucket (ADR-0037). The address, the passwords and the bucket's
# URL are in /run/stackr/.env, which the stackr-state unit writes from Secrets Manager each time it
# starts. Prometheus evaluates alerts.yml's rules, which watch the backups and the drill.

name: stackr-state

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.19.9@sha256:bdb5c911a23d92fd364e246ab20b5a0a485f00112f3663fa626b083fb46c146b
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?stackr-state.service writes it}
      CLICKHOUSE_LANGFUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?stackr-state.service writes it}
      CLICKHOUSE_BACKUP_PASSWORD: ${CLICKHOUSE_BACKUP_PASSWORD:?stackr-state.service writes it}
      CLICKHOUSE_BACKUP_URL: ${CLICKHOUSE_BACKUP_URL:?stackr-state.service writes it}
    volumes:
      - ../../clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ../../host/clickhouse/backup-user.xml:/etc/clickhouse-server/users.d/backup-user.xml:ro
      - ./clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - /data/clickhouse:/var/lib/clickhouse
      - /data/clickhouse-logs:/var/log/clickhouse-server
    ports:
      - ${STATE_HOST_ADDRESS:?stackr-state.service writes it}:8123:8123
      - ${STATE_HOST_ADDRESS:?stackr-state.service writes it}:9000:9000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - /data/prometheus:/prometheus
    ports:
      - ${STATE_HOST_ADDRESS:?stackr-state.service writes it}:9090:9090
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.15.1@sha256:186f9fe791158ef25d6f810109746ac0acdb35cb8401b554526c77c065483373
    restart: unless-stopped
    command:
      - -label=tenant_id
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
      - -internal-listen-address=127.0.0.1:8081
    ports:
      - ${STATE_HOST_ADDRESS:?stackr-state.service writes it}:9091:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/metrics"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      - prometheus
