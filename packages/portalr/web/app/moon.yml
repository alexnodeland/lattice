# The people's UI: sign in, pick a tenant and a workspace, and work.
language: 'typescript'
layer: 'application'
dependsOn:
  - 'client'
  - 'ui'

tasks:
  build:
    outputs:
      - '/packages/portalr/src/portalr/static/app/**/*'
    options:
      mergeOutputs: 'replace'

  # The app's scenarios against portalr's test application, with Supabase Auth (portalr ADR-0013),
  # in CI's Acceptance job. It needs Docker, and Chromium for Playwright.
  bdd:
    description: "Run the app's scenarios against portalr's test application"
    command: 'scripts/bdd'
    deps:
      - 'app:build'
      - 'admin:build'
    inputs:
      - 'bdd/**/*'
      - 'src/**/*'
      - 'scripts/bdd'
      - 'playwright.config.ts'
      - '/packages/portalr/compose.yaml'
      - '/packages/portalr/tests/app/**/*'
      - '/packages/portalr/src/**/*'
      - '/packages/grantr/src/**/*'
      - '/packages/artifactr/src/**/*'
    options:
      cache: false

