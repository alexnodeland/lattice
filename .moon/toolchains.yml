# portalr's web packages are a Bun workspace (stackr's RFC-0003, The Bun workspace). Bun installs
# the dependencies and moon never edits a manifest, a lockfile or a tsconfig.json, so every
# setting that would is off. Bun's version is the one in .prototools.
javascript:
  packageManager: 'bun'
  installDependencies: false
  inferTasksFromScripts: false
  dedupeOnLockfileChange: false
  syncPackageManagerField: false
  syncProjectWorkspaceDependencies: false

bun: {}

typescript:
  rootOptionsConfigFileName: 'tsconfig.base.json'
  createMissingConfig: false
  includeProjectReferenceSources: false
  includeSharedTypes: false
  pruneProjectReferences: false
  routeOutDirToCache: false
  syncProjectReferences: false
  syncProjectReferencesToPaths: false
