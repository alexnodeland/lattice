# Pyroscope 2, as a single process. Applications push profiles to it on 4040.
# Its data is on a local volume on one machine, and in S3 on AWS (stackr
# ADR-0034), as the environment says: Pyroscope reads it with
# -config.expand-env=true, and each setting has one machine's value by default.
target: all
architecture_storage: v2

server:
  http_listen_port: 4040

storage:
  backend: ${PYROSCOPE_BACKEND:-filesystem}
  prefix: ${S3_PREFIX:-}
  filesystem:
    dir: /data/v2/shared
  s3:
    bucket_name: ${S3_BUCKET:-}
    region: ${S3_REGION:-}
    endpoint: ${S3_ENDPOINT:-}
    insecure: ${S3_INSECURE:-false}
    force_path_style: ${S3_PATH_STYLE:-false}

metastore:
  data_dir: /data/v2/metastore/data
  raft:
    dir: /data/v2/metastore/raft

analytics:
  reporting_enabled: false
