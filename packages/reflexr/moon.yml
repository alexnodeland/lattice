# reflexr.
language: 'python'
layer: 'library'
tags: ['distribution', 'api']
dependsOn:
  - 'evalr'
  - 'lattice-core'

tasks:
  api:
    env:
      API_SERVICE: 'oncall'
      # Ports the system picks, which scripts/api reads back.
      ONCALL_PORT: '0'
      REFLEXR_PG_PORT: '0'
    inputs:
      # oncall, the reference application the collection runs against.
      - '/examples/oncall/**/*'

  test:
    inputs:
      # The layering test holds oncall, the reference implementation, to the public API.
      - '/examples/oncall/src/**/*'
      # $REFLEXR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
      # always sets it, so every pull request would run these tests. CI never restores moon's
      # cache; locally, `moon run reflexr:test --force` runs the PostgreSQL tests past a cached
      # run without them.

  schema:
    description: "Regenerate the rule and protocol JSON Schemas, the REST surface's OpenAPI document, and the catalog of commands"
    script: >-
      uv run python $workspaceRoot/scripts/generate.py schemas/reflexr.rules.v1.json reflexr.core.schema rules
      && uv run python $workspaceRoot/scripts/generate.py schemas/reflexr.v1.json reflexr.core.schema protocol
      && uv run python $workspaceRoot/scripts/generate.py schemas/reflexr.commands.json reflexr.commands.schema
      && uv run python $workspaceRoot/scripts/generate.py schemas/reflexr.openapi.json reflexr.fastapi.openapi
    options:
      cache: false
      runInCI: false

  dashboards:
    description: 'Regenerate the Grafana dashboards in deploy/grafana/dashboards'
    command: 'uv run python scripts/grafana_dashboards.py'
    options:
      cache: false
      runInCI: false

  pg-up:
    description: 'Start PostgreSQL for the SQL tests, from compose.yaml, as a compose project of its own on a port the system picks'
    command: '$workspaceRoot/scripts/pg up'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop the contributor stack: PostgreSQL, and oncall if it runs'
    script: 'COMPOSE_PROFILES=app $workspaceRoot/scripts/pg down'
    options:
      cache: false
      runInCI: false

  app-up:
    description: 'Build and start oncall, the reference app, on PostgreSQL, at http://localhost:8000'
    script: 'COMPOSE_PROFILES=app $workspaceRoot/scripts/pg up --build'
    options:
      cache: false
      runInCI: false

  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    script: 'url=$($workspaceRoot/scripts/pg url) && REFLEXR_TEST_POSTGRES_URL=$url uv run pytest --cov --cov-report=term-missing --durations=10'
    options:
      cache: false
      runInCI: false
