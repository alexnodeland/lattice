# Grafana's data sources, with fixed uids so dashboards and links can refer to
# them: prometheus, tempo, loki and pyroscope, and analytics, portalr's events in
# ClickHouse (ADR-0048). The libraries' dashboards use
# these uids. Each one's address is in the environment, which Grafana expands
# here: Compose's names on one machine (compose.yaml), and the AWS recipe's
# (stackr ADR-0034).
apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://${PROMETHEUS_ADDRESS}:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      # Applications export metrics through the Collector once a minute (the OTel
      # SDK's default), so a rate needs at least a minute of samples:
      # $__rate_interval is at least four of these.
      timeInterval: 60s
      # Exemplars link a histogram's samples to the trace that produced them:
      # `trace_id` from OTLP metrics, `traceID` from Tempo's metrics generator.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Trace
        - name: traceID
          datasourceUid: tempo
          urlDisplayLabel: Trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://${TEMPO_ADDRESS}:3200
    editable: false
    jsonData:
      # Trace to logs: the logs of the same service, around the span's time,
      # filtered to the trace id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      # Trace to metrics: the span metrics Tempo's metrics generator writes.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
          - name: Error rate
            query: sum(rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m]))
          - name: Latency (p95)
            query: histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))
      # Trace to profiles: the CPU profile of the span's service.
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
      streamingEnabled:
        search: true
        metrics: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://${LOKI_ADDRESS}:3100
    editable: false
    jsonData:
      # Log lines that carry a trace id link to the trace in Tempo. OTLP logs
      # keep it as structured metadata, `trace_id`.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Trace

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://${PYROSCOPE_ADDRESS}:4040
    editable: false

  # portalr's product analytics on ClickHouse (lattice RFC-0008, ADR-0048), read as a user that
  # may only read analytics.events, every tenant's: Grafana is for operators (portalr ADR-0005).
  - name: Analytics
    uid: analytics
    type: grafana-clickhouse-datasource
    editable: false
    jsonData:
      host: ${CLICKHOUSE_ADDRESS}
      port: 8123
      protocol: http
      username: grafana_analytics
      defaultDatabase: analytics
      # Seconds. The plugin asks ClickHouse for a little more than the query's, within the
      # 30 its user may not exceed (deploy/clickhouse/analytics-users.xml).
      queryTimeout: "10"
      dialTimeout: "5"
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
