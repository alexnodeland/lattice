# lattice's oncall is examples/oncall, a workspace member installed from this repository; an
# unrelated package on PyPI has the same name.
[[PackageOverrides]]
name = "oncall"
ecosystem = "PyPI"
ignore = true
reason = "lattice's oncall is its reference implementation, installed from examples/oncall, not PyPI's oncall."
