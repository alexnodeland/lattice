[project]
name = "relayr-ai"
version = "0.1.0.dev0"
description = "The bridge between artifactr and reflexr: events from chats and artifacts become events for rules, and runs act back in the chat as proposals and notices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "events", "rules", "collaboration", "artifacts", "pydantic-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "artifactr-ai>=0.1.0",
    "reflexr>=0.1.0.dev0",
]

[project.optional-dependencies]
sql = ["sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]
sqlite = ["relayr-ai[sql]", "aiosqlite>=0.22"]
postgres = ["relayr-ai[sql]", "asyncpg>=0.31"]

[project.urls]
Homepage = "https://relayr.alexnodeland.com"
Documentation = "https://relayr.alexnodeland.com"
Repository = "https://github.com/alexnodeland/relayr"
Issues = "https://github.com/alexnodeland/relayr/issues"
Changelog = "https://github.com/alexnodeland/relayr/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "pre-commit>=4.6",
]

# In lattice, the libraries are the checkout's. A built wheel keeps the ranges in [project]
# alone.
[tool.uv.sources]
artifactr-ai = { workspace = true }
reflexr = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Distributed as relayr-ai; imported as relayr.
[tool.uv.build-backend]
module-name = "relayr"

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/relayr"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
