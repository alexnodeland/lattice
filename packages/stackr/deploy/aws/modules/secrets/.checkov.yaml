# checkov over the secrets module (RFC-0004), run by deploy/aws/check. Each check it skips here is
# skipped for this module only, with its reason; nothing is skipped inline.
framework:
  - terraform
compact: true
quiet: true
skip-check:
  # Automatic rotation: the secrets that encrypt data never rotate (RFC-0004), and a generated
  # secret rotates when its version is raised, with the consumers that read it.
  - CKV2_AWS_57
  # A customer-managed key per deployment comes later (RFC-0004): AWS's encrypts the secrets.
  - CKV_AWS_149
