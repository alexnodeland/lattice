\* A pull request's run: liveness, and I3's claims and hand-overs, with a failure or cancellation,
\* and callers that ask again; no crash, which ThreadClaimRecovery.cfg adds without the fault.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    MaxLog = 2
    MaxReq = 1
    MaxPauses = 1
    TTL = 1
    MaxCrashes = 0
    MaxFaults = 1
    Stalls = FALSE
    Retries = TRUE
INVARIANTS
    TypeOK
    I3_ClaimHasATask
    I3_NoStrandedAsk
PROPERTIES
    AskedIsTaken
    SentIsTaken
