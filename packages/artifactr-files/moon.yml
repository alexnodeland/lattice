# artifactr-files, distributed as artifactr-files-ai: native files as artifactr artifacts.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn:
  - 'artifactr'
  - 'lattice-core'

tasks:
  pg-up:
    description: 'Start PostgreSQL for the SQL tests, from compose.yaml, on port 54333'
    command: 'docker compose up -d --wait postgres'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop PostgreSQL'
    command: 'docker compose down'
    options:
      cache: false
      runInCI: false

  # $ARTIFACTR_FILES_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a
  # change, and CI always sets it, so every pull request would run these tests. CI never restores
  # moon's cache; locally, `moon run artifactr-files:test --force` runs the PostgreSQL tests past a
  # cached run without them.
  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    command: 'uv run pytest --cov --cov-report=term-missing'
    env:
      ARTIFACTR_FILES_TEST_POSTGRES_URL: 'postgresql+asyncpg://postgres:artifactr-files@localhost:54333/postgres'
    options:
      cache: false
      runInCI: false
