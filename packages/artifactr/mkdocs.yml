          - adr/0004-optimistic-concurrency-and-revisions.md
          - adr/0005-one-event-log-per-workspace.md
          - adr/0006-agent-integration-as-pydantic-ai-capability.md
          - adr/0007-caller-owned-live-output.md
          - adr/0008-agent-perception-and-steering.md
          - adr/0009-write-policies-and-non-blocking-proposals.md
          - adr/0010-pausing-with-deferred-tools.md
          - adr/0011-workspace-scoped-artifacts-and-tenant-handles.md
          - adr/0012-surfaces-websocket-rest-mcp.md
          - adr/0013-library-with-reference-implementation.md
          - adr/0014-trunk-based-development-with-rfcs-and-adrs.md
