# oncall, reflexr's reference implementation.
language: 'python'
layer: 'application'
dependsOn:
  - 'reflexr'

tasks:
  image:
    description: "Build oncall's image from lattice's root, and start it on PostgreSQL"
    command: '$workspaceRoot/scripts/image oncall'
    env:
      COMPOSE_FILE: '../../packages/reflexr/compose.yaml'
      COMPOSE_PROFILES: 'app'
      # Ports the system picks, so it runs beside `pg-up`, `app-up` and other runs.
      ONCALL_PORT: '0'
      REFLEXR_PG_PORT: '0'
    inputs:
      - 'Dockerfile'
      - '/scripts/image'
      - '/scripts/compose-project.sh'
      - 'Dockerfile.dockerignore'
      - 'README.md'
      - 'pyproject.toml'
      - 'src/**/*'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/packages/*/pyproject.toml'
      - '/examples/*/pyproject.toml'
      - '/packages/reflexr/compose.yaml'
      - '/packages/reflexr/README.md'
      - '/packages/reflexr/LICENSE'
      - '/packages/reflexr/src/**/*'
      - '/packages/evalr/README.md'
      - '/packages/evalr/LICENSE'
      - '/packages/evalr/src/**/*'
      - '/packages/lattice-core/README.md'
      - '/packages/lattice-core/LICENSE'
      - '/packages/lattice-core/src/**/*'
