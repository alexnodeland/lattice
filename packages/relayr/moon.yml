# relayr, distributed as relayr-ai: the bridge between artifactr and reflexr.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn:
  - 'artifactr'
  - 'evalr'
  - 'lattice-core'
  - 'reflexr'

tasks:
  test:
    # A worker for each of the runner's cores, sharing nothing (lattice ADR-0010).
    args: ['--numprocesses', 'auto']

  schema:
    description: "Regenerate the OpenAPI document of relayr's routes, which portalr's client is typed from"
    script: 'uv run python $workspaceRoot/scripts/generate.py schemas/relayr.openapi.json relayr.fastapi.openapi'
    options:
      cache: false
      runInCI: false

  pg-up:
    description: 'Start PostgreSQL for the SQL tests, from compose.yaml, as a compose project of its own on a port the system picks'
    command: '$workspaceRoot/scripts/pg up'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop the contributor stack: PostgreSQL, and Vikunja if it runs'
    script: 'COMPOSE_PROFILES=trackers $workspaceRoot/scripts/pg down'
    options:
      cache: false
      runInCI: false

  # $RELAYR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
  # always sets it, so every pull request would run these tests. CI never restores moon's cache;
  # locally, `moon run relayr:test --force` runs the PostgreSQL tests past a cached run without
  # them.
  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    script: 'url=$($workspaceRoot/scripts/pg url) && RELAYR_TEST_POSTGRES_URL=$url uv run pytest --cov --cov-report=term-missing --durations=10'
    options:
      cache: false
      runInCI: false

  vikunja-up:
    description: 'Start Vikunja for the tracker contract test, live, from compose.yaml, on port 54333'
    script: 'COMPOSE_PROFILES=trackers $workspaceRoot/scripts/pg up vikunja'
    options:
      cache: false
      runInCI: false

  # With RELAYR_RECORD=1 as well, the live exchanges replace tests/trackers/fixtures/vikunja.
  test-vikunja:
    description: 'Run the tracker contract test against Vikunja, live (after vikunja-up)'
    command: 'uv run pytest --durations=10 tests/trackers/test_contract.py'
    env:
      RELAYR_TEST_VIKUNJA_URL: 'http://localhost:54333'
    options:
      cache: false
      runInCI: false
