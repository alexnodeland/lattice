# portalr: the portal. Its Python side, the router that serves the two UIs. The web packages
# under web/ are projects of their own, so its Python tasks read only the Python package's files.
language: 'python'
layer: 'library'
tags: ['distribution', 'api']
dependsOn:
  - 'grantr'
  - 'artifactr' # its test application mounts artifactr's router and reflexr's
  - 'reflexr'
  - 'lattice-core' # the workspace tag it reads spend by

fileGroups:
  python:
    - 'src/**/*'
    - '!src/portalr/static/**/*'
    - 'scripts/**/*'
    - 'tests/**/*'
    - 'schemas/**/*'
    # The policy ui's CSP tests serve, which a test holds to the router's.
    - 'web/ui/csp/policy.txt'
    - 'pyproject.toml'
    - 'README.md'
    - 'LICENSE'

tasks:
  lint:
    inputs: ['@group(python)']
    options:
      mergeInputs: 'replace'
  typecheck:
    inputs: ['@group(python)']
    options:
      mergeInputs: 'replace'
  test:
    inputs: ['@group(python)']
    options:
      mergeInputs: 'replace'
  # The wheel carries the two UIs, which Vite builds into src/portalr/static/.
  build:
    inputs: ['@group(python)', 'src/portalr/static/**/*']
    deps:
      - 'app:build'
      - 'admin:build'
    options:
      mergeInputs: 'replace'

  # The two tasks below read what app's and admin's builds wrote, so they depend on those builds.
  # They are portalr's and not web/notices's: app and admin depend on notices (their package.json
  # names it), and a notices task that depended on their builds would make a project cycle.
  #
  # The licence policy's exceptions (web/notices/policy.json), each still needed by a package in
  # one of the two bundles: read from the notices their builds wrote (portalr ADR-0033).
  licence-exceptions:
    description: "Fail on an exception to the licence policy that no bundled package needs"
    command: 'bun run --bun web/notices/scripts/exceptions.ts'
    inputs:
      - 'web/notices/policy.json'
      - 'web/notices/src/**/*'
      - '!web/notices/src/**/*.test.ts'
      - 'web/notices/scripts/*'
      - 'src/portalr/static/*/THIRD-PARTY-NOTICES.txt'
    deps:
      - 'app:build'
      - 'admin:build'

  # The wheel's `license` expression, to list the licences of what the bundles hold.
  licence-expression:
    description: "Fail unless the license expression covers the bundled packages' licences"
    command: 'bun run --bun web/notices/scripts/licence-expression.ts'
    inputs:
      - 'pyproject.toml'
      - 'web/notices/src/**/*'
      - '!web/notices/src/**/*.test.ts'
      - 'web/notices/scripts/*'
      - 'src/portalr/static/*/THIRD-PARTY-NOTICES.txt'
    deps:
      - 'app:build'
      - 'admin:build'

  # Each UI's gzip size against the ceilings in size-budget.json (portalr ADR-0040).
  size:
    description: "Fail when a built UI is larger than its budget"
    command: 'uv run --no-project python scripts/check_size.py'
    inputs:
      - 'scripts/check_size.py'
      - 'size-budget.json'
      - 'src/portalr/static/**/*'
    deps:
      - 'app:build'
      - 'admin:build'

  ui-in-wheel:
    description: "Check that the built wheel carries both UIs, and their third-party notices"
    command: 'uv run --no-project python scripts/check_wheel.py'
    inputs: ['scripts/check_wheel.py']
    deps:
      - 'build'
      - 'licence-exceptions'
      - 'licence-expression'
  standalone:
    inputs: ['@group(python)', '/scripts/standalone.py']
    options:
      mergeInputs: 'replace'
  deptry:
    inputs: ['@group(python)']
    options:
      mergeInputs: 'replace'
  format:
    inputs: ['@group(python)']
    options:
      mergeInputs: 'replace'
  check:
    inputs: ['@group(python)']
    deps:
      - 'ui-in-wheel'
      - 'size'
    options:
      mergeInputs: 'replace'

  # Its own acceptance run, in place of the tag's: the test application beside the tools, the
  # two-tenant test, the Bruno collection with the tools up and then down, and Schemathesis.
  api:
    command: 'scripts/api'
    deps:
      - 'app:build'
      - 'admin:build'
    inputs:
      - 'src/portalr/static/**/*'
      - '/packages/stackr/deploy/**/*'
      - '/packages/grantr/src/**/*'
    options:
      mergeArgs: 'replace'

  schema:
    description: "Regenerate the router's OpenAPI document, schemas/portalr.openapi.json"
    script: 'uv run python -m portalr.fastapi.openapi > schemas/portalr.openapi.json'
    options:
      cache: false
      runInCI: false
