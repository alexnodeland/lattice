# artifactr, distributed as artifactr-ai.
language: 'python'
layer: 'library'
tags: ['distribution', 'api']
dependsOn:
  - 'evalr'
  - 'lattice-core'

tasks:
  api:
    env:
      API_SERVICE: 'docplan'
      # Ports the system picks, which scripts/api reads back.
      DOCPLAN_PORT: '0'
      ARTIFACTR_PG_PORT: '0'
    inputs:
      # docplan, the reference application the collection runs against.
      - '/examples/docplan/**/*'

  test:
    inputs:
      # The layering test holds docplan, the reference implementation, to the public API.
      - '/examples/docplan/src/**/*'
      # $ARTIFACTR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
      # always sets it, so every pull request would run these tests. CI never restores moon's
      # cache; locally, `moon run artifactr:test --force` runs the PostgreSQL tests past a cached
      # run without them.

  # TLC over the thread claim's TLA+ spec (lattice ADR-0025), at a pull request's bounds. CI's Specs
  # job runs it in each affected project; it needs Java 11 or later. The inputs are what the spec
  # models: the runner and its capability, the workspace and its claim, and core's run rules.
  spec:
    description: "Model-check the thread claim's TLA+ spec with TLC, at a pull request's bounds"
    command: >-
      $workspaceRoot/scripts/tlc $workspaceRoot/docs/artifactr/spec/ThreadClaim.tla
      ThreadClaim.cfg ThreadClaimLive.cfg
    inputs:
      - '/docs/artifactr/spec/**/*'
      - '/scripts/tlc'
      - '/scripts/tlc.sha256'
      - 'src/artifactr/agent/**/*'
      - 'src/artifactr/workspace/**/*'
      - 'src/artifactr/core/rules.py'

  # The same at Nightly's deeper bounds, and with claims that lapse under a live holder.
  spec-deep:
    description: "Model-check the thread claim's TLA+ spec with TLC, at Nightly's deeper bounds"
    command: >-
      $workspaceRoot/scripts/tlc $workspaceRoot/docs/artifactr/spec/ThreadClaim.tla
      ThreadClaimDeep.cfg ThreadClaimLapse.cfg
    inputs:
      - '/docs/artifactr/spec/**/*'
      - '/scripts/tlc'
      - '/scripts/tlc.sha256'
      - 'src/artifactr/agent/**/*'
      - 'src/artifactr/workspace/**/*'
      - 'src/artifactr/core/rules.py'

  schema:
    description: "Regenerate the protocol JSON Schema, and the REST surface's OpenAPI document"
    script: >-
      uv run python -m artifactr.core.schema > schemas/artifactr.v1.json
      && uv run python -m artifactr.fastapi.openapi > schemas/artifactr.openapi.json
    options:
      cache: false
      runInCI: false

  dashboards:
    description: 'Regenerate the Grafana dashboards in deploy/grafana/dashboards'
    command: 'uv run python scripts/grafana_dashboards.py'
    options:
      cache: false
      runInCI: false

  pg-up:
    description: "Start PostgreSQL for the SQL tests, from compose.yaml, on port 54329"
    command: 'docker compose up -d --wait postgres'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop the contributor stack: PostgreSQL, and docplan if it runs'
    command: 'docker compose --profile app down'
    options:
      cache: false
      runInCI: false

  app-up:
    description: 'Build and start docplan, the reference app, on PostgreSQL, at http://localhost:8000'
    command: 'docker compose --profile app up -d --build --wait'
    options:
      cache: false
      runInCI: false

  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    command: 'uv run pytest --cov --cov-report=term-missing'
    env:
      ARTIFACTR_TEST_POSTGRES_URL: 'postgresql+asyncpg://postgres:artifactr@localhost:54329/postgres'
    options:
      cache: false
      runInCI: false
