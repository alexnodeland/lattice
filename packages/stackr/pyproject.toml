# stackr is not a Python package. This file pins the tools that develop and
# validate it (linters, pre-commit, git-cliff, Copier for the application
# template, and Zensical for the documentation site), so `make` and CI run the
# same versions from uv.lock, as in the rest of the family.
[project]
name = "stackr"
version = "0.0.0"
description = "The infrastructure template for artifactr, reflexr and evalr."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "copier>=9.18",
  "pre-commit>=4.6.2",
  "pyyaml>=6.0.3",
  "ruff>=0.16.9",
  "shellcheck-py>=0.11.0.1",
  "yamllint>=1.38.0",
]

[tool.uv]
package = false

[tool.ruff]
# The root's configuration, with stackr's own rules for its scripts.
extend = "../../pyproject.toml"
# The scripts import scripts/_env.py as a first-party module.
src = [".", "scripts"]
# The scripts are Python without a `.py` suffix, so they read as commands.
extend-include = [
  "scripts/setup-env",
  "scripts/check-config",
  "scripts/create-tenant",
  "scripts/bump-libraries",
  "scripts/check-template",
  "scripts/docs-reference",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
