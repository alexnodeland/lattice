# lattice's documentation site, built with Zensical: one build, with a section per package
# under docs/<package>/, each ordered by its own .nav.yml (stackr's RFC-0003, Docs).
# `moon run lattice:docs` builds it in strict mode; `moon run lattice:docs-serve` serves it with
# live reload.

site_name: lattice
site_description: >-
  The packages: artifactr, reflexr, evalr, relayr, grantr and stackr, for applications in
  which people and agents work together.
site_author: Alex Nodeland
site_url: https://lattice.alexnodeland.com/
repo_url: https://github.com/alexnodeland/lattice
repo_name: alexnodeland/lattice
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Alex Nodeland. Released under the MIT License.
docs_dir: docs

# lattice's mark and favicon (ADR-0001). lattice.css shows the dark mark in the dark scheme.
theme:
  name: material
  variant: modern
  language: en
  logo: assets/brand/mark-light.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Schibsted Grotesk
    code: Fragment Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Use the light scheme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Use the dark scheme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Follow the system scheme
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

extra_css:
  - assets/stylesheets/lattice.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  # Nested lists are indented by two spaces, as GitHub renders them; Python-Markdown needs four
  # without this.
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Pages include files from the repository instead of copying them: the root's
      # CONTRIBUTING.md and others under docs/project/, each package's CHANGELOG.md, and the
      # files stackr's reference pages describe. Paths are from the repository's root.
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# One build resolves the cross-references between packages, so no package needs another's
# inventory. Every member is installed in the workspace's environment, so mkdocstrings finds
# them without paths.
plugins:
  - search
  # Zensical implements awesome-nav itself: each folder's .nav.yml orders its section.
  - awesome-nav
  # Instructions for coding agents, beside the pages they describe, aren't pages of the site.
  # Zensical implements the exclude plugin itself and ignores mkdocs' exclude_docs.
  # llms.txt and llms-full.txt at the site's root, for agents reading the docs without the
  # source. Zensical implements the llmstxt plugin itself.
  - llmstxt:
      markdown_description: >-
        Python libraries for applications in which people and agents work together, and the
        stack they run on. Each package's section has its guides, reference, ADRs and RFCs.
      full_output: llms-full.txt
      sections:
        lattice:
          - index.md: Home
          - architecture.md: How the repository and its packages fit together
          - upgrading-to-0.2.md
        Packages:
          - artifactr/index.md: artifactr, versioned artifacts that people and agents share
          - reflexr/index.md: reflexr, rules over event streams that run agents
          - evalr/index.md: evalr, typed evaluations that learn from feedback
          - relayr/index.md: relayr, events from artifactr and task trackers to reflexr
          - grantr/index.md: grantr, identity and access
          - portalr/index.md: portalr, the portal
          - stackr/index.md: stackr, the stack and the application template
          - lattice-core/index.md: lattice-core, what the libraries share
        Guides:
          - "*/guides/*.md"
          - "*/getting-started.md"
        Reference:
          - "*/reference/*.md"
          - "*/architecture.md"
  - exclude:
      regex: ['(^|/)AGENTS\.md$']
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://ai.pydantic.dev/objects.inv
            - https://opentelemetry-python.readthedocs.io/en/latest/objects.inv
          options:
            docstring_style: google
            extensions:
              - griffe_pydantic:
                  schema: false
              - scripts/griffe_sphinx_roles.py:SphinxRoles
            filters: ["!^_", "!^model_config$"]
            heading_level: 3
            members_order: source
            # The packages re-export what they share from lattice-core, so their pages resolve its
            # names, which griffe finds only in modules it has loaded.
            preload_modules: [lattice_core]
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
