# lattice-core: what the libraries share and must keep identical. It imports none of them.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn: []

tasks:
  schema:
    description: "Regenerate the platform contracts' JSON Schemas (lattice RFC-0011)"
    script: >-
      uv run python $workspaceRoot/scripts/generate.py schemas/approvals.v1.json lattice_core.contracts approvals
      && uv run python $workspaceRoot/scripts/generate.py schemas/capabilities.v1.json lattice_core.contracts capabilities
    options:
      cache: false
      runInCI: false
