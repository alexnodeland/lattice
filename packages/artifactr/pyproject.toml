[project]
name = "artifactr-ai"
version = "0.2.0"
description = "Build chat applications where people and agents collaborate through shared, versioned artifacts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "collaboration", "artifacts", "pydantic-ai", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "lattice-core-ai>=0.1.0.dev0",
    "pydantic>=2.13",
    "jsonpatch>=1.33",
    "jsonpointer>=1.9",
    "pydantic-ai-slim>=2.51",
    "opentelemetry-api>=1.28",
]

[project.optional-dependencies]
sql = ["lattice-core-ai[sql]>=0.1.0.dev0", "sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]
sqlite = ["artifactr-ai[sql]", "aiosqlite>=0.22"]
postgres = ["artifactr-ai[sql]", "asyncpg>=0.31"]
fastapi = ["fastapi>=0.141", "starlette>=0.46.0"]
mcp = ["mcp>=2.2", "starlette>=0.27"]
# The SDK's setup is lattice-core's; this package imports the SDK for its own views.
otel = ["lattice-core-ai[otel]>=0.1.0.dev0", "opentelemetry-sdk>=1.45"]
langfuse = [
    "lattice-core-ai[langfuse]>=0.1.0.dev0",
    "langfuse>=4.15,<5",
    # The score mapping and ports that artifactr.scores' mirror builds on, and evalr.langfuse's
    # score adapters, which send the mirror's scores to Langfuse.
    "evalr[langfuse]>=0.1.0.dev0",
]
litellm = ["lattice-core-ai[litellm]>=0.1.0.dev0"]
evals = ["evalr>=0.1.0.dev0"]

[project.urls]
Homepage = "https://lattice.alexnodeland.com/artifactr/"
Documentation = "https://lattice.alexnodeland.com/artifactr/"
Repository = "https://github.com/alexnodeland/lattice"
Issues = "https://github.com/alexnodeland/lattice/issues"
Changelog = "https://github.com/alexnodeland/lattice/blob/main/packages/artifactr/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "hypothesis>=6.168",
    "httpx>=0.28",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "opentelemetry-sdk>=1.28",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# In lattice, evalr and lattice-core are the checkout's. A built wheel keeps the ranges in
# [project] alone.
[tool.uv.sources]
evalr = { workspace = true }
lattice-core-ai = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Distributed as artifactr-ai (ADR-0025); imported as artifactr.
[tool.uv.build-backend]
module-name = "artifactr"

# ─── dependencies ─────────────────────────────────────────────────────────────

# deptry can't tell from the workspace's editable install which module lattice-core-ai provides.
[tool.deptry.package_module_name_map]
lattice-core-ai = "lattice_core"

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A test that runs for a minute is stuck: fail it, with every thread's stack.
timeout = 60
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # backoff, which Langfuse uses, calls asyncio.iscoroutinefunction, deprecated in Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff._decorator",
]
markers = [
    "postgres: needs a PostgreSQL database (set ARTIFACTR_TEST_POSTGRES_URL)",
]

[tool.coverage.run]
branch = true
# By path rather than package name, so the migrations Alembic loads from files are measured too.
source = ["src/artifactr"]
# SQLAlchemy runs run_sync callables in a greenlet, which coverage follows only when told.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
