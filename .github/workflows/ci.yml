# lattice's CI, on every pull request (stackr's RFC-0003, CI and tooling). Each job runs its task
# in every project the pull request affects, and in every project that depends on one, all the way
# down (scripts/affected.py). nightly.yml runs everything on main. CI, the last job, and Title
# (title.yml) are the required checks.

name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# What the pull request changes, for moon: its merge commit against its base.
env:
  MOON_BASE: origin/${{ github.base_ref }}
  MOON_HEAD: HEAD

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    # A change that reaches every package takes some 17 minutes, artifactr's and reflexr's tests
    # the longest, on SQLite and PostgreSQL: 30 leaves room as they grow, and for a slow runner.
    # in parallel.
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ARTIFACTR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/artifactr
      REFLEXR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/reflexr
      GRANTR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/grantr
      RELAYR_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:lattice@localhost:5432/relayr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon compares with main to find what a change affects
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      # The libraries' SQL tests run in parallel, so each gets its own database.
      - name: One database per library
        env:
          PGPASSWORD: lattice
        run: psql -h localhost -U postgres -c 'CREATE DATABASE artifactr' -c 'CREATE DATABASE reflexr' -c 'CREATE DATABASE grantr' -c 'CREATE DATABASE relayr'
      - run: uv sync --locked --all-packages --all-groups --all-extras
      - run: bun install --frozen-lockfile
      # ui's tests run in Chromium, through Vitest's browser mode; ui holds Playwright.
      - run: bun x --bun --no-install playwright install --with-deps --only-shell chromium
        working-directory: packages/portalr/web/ui
      - run: uv run --no-project python scripts/affected.py check
      # ui's screenshots as this run took them, beside any baseline they missed: a new or changed
      # look's baselines are these files, reviewed and committed (portalr ADR-0019).
      - name: Upload ui's screenshots
        if: failure() && hashFiles('packages/portalr/web/ui/.vitest/attachments/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: packages/portalr/web/ui/.vitest/attachments/
          retention-days: 7

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: uv sync --locked --all-packages --all-groups --all-extras
      - run: bun install --frozen-lockfile
      # ui's tests run in Chromium, through Vitest's browser mode; ui holds Playwright.
      - run: bun x --bun --no-install playwright install --with-deps --only-shell chromium
        working-directory: packages/portalr/web/ui
      - run: uv run --no-project python scripts/affected.py test

  # docplan's and oncall's images, each built from the root and started on PostgreSQL.
  images:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: uv run --no-project python scripts/affected.py image

  # TLC over the formal specs (ADR-0025), at the bounds a pull request checks: the `spec` task of
  # each project scripts/affected.py finds affected, by its files or by the task's inputs, which
  # include its spec in docs/<package>/spec/. Nightly runs them deeper.
  specs:
    name: Specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: uv run --no-project python scripts/affected.py spec

  # GoTrue's image follows the Supabase CLI's (stackr ADR-0026, issue 132). It reads the CLI's own
  # pins from GitHub, so it runs only when the pull request's own diff changes versions.env,
  # compose.yaml or the AWS stack's locals.tf, none other, a change to stackr or a library included.
  # The job always starts, to compare the diff, and counts as passed when it has nothing to check.
  # It fails, after one retry, when it can't read the CLI's pins, and a Renovate bump of GoTrue
  # ahead of the CLI fails it: bump the CLI first. CI runs on pull requests alone, and a push to
  # main is a merged pull request that ran it, so nothing runs it there.
  gotrue:
    name: GoTrue follows the Supabase CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        shell: bash
        run: |
          # The diff on its own line, so a git failure fails the step: nothing is skipped by it.
          files=$(git diff --name-only "$MOON_BASE...$MOON_HEAD")
          echo "Comparing $MOON_HEAD with $MOON_BASE: $(grep -c . <<<"$files" || true) files changed"
          if grep -qxF -e packages/stackr/versions.env -e packages/stackr/compose.yaml \
            -e packages/stackr/deploy/aws/modules/stack/locals.tf <<<"$files"; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "the check's files changed"
          else
            echo "none of versions.env, compose.yaml or locals.tf changed: nothing to check"
          fi
      - if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - if: steps.changed.outputs.changed == 'true'
        run: uv sync --locked --all-packages --all-groups
      - if: steps.changed.outputs.changed == 'true'
        run: moon run stackr:gotrue

  # stackr's thin images (RFC-0004, stackr ADR-0035), built natively for each architecture the AWS
  # recipe runs on, Fargate's arm64 and the runners' amd64, and each checked as it starts.
  # Nothing is published: the release does that.
  thin-images:
    name: Thin images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: uv run --no-project python scripts/affected.py images

  # A stackr release's image path (stackr ADR-0035), short of GHCR, when the images change: each
  # architecture's OCI archives, built by deploy/image-archive on a runner of that architecture,
  # as release.yml builds them. They are kept a week.
  release-images:
    name: Release images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      # When stackr:images' inputs change: the images' files, and these scripts.
      - id: build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # moon's answer first, on its own: if moon fails, so does this, rather than skipping.
          affected=$(moon query tasks --affected --id images)
          # An answer of moon's shape, or fail: a malformed one isn't "not affected".
          jq --exit-status '.tasks | type == "object"' <<<"$affected" >/dev/null
          if jq --exit-status '.tasks.stackr.images' <<<"$affected" >/dev/null; then
            packages/stackr/deploy/image-archive "$ARCH" 0.0.0-ci archives
            echo "built=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackr-images-${{ matrix.arch }}
          path: archives/
          retention-days: 7
          compression-level: 0
          overwrite: true

  # Then deploy/publish-image, as release.yml runs it, to a registry on this job's loopback in
  # place of GHCR: each image's two architectures, joined under one version, with its annotations.
  release-images-publish:
    name: Release images (published to a registry of its own)
    needs: release-images
    if: needs.release-images.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      registry:
        image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
        ports:
          - 127.0.0.1:5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stackr-images-*
          path: archives
          merge-multiple: true
      - name: Publish each image, and inspect its index
        shell: bash
        env:
          INSECURE: "1"
        run: |
          list=$(packages/stackr/deploy/image-archive --list)
          mapfile -t images < <(jq --raw-output '.[]' <<<"$list")
          verified=0
          for image in "${images[@]}"; do
            reference=$(packages/stackr/deploy/publish-image "$image" 0.0.0-ci "localhost:5000/stackr-$image" archives)
            index=$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}')
            jq --exit-status '([.manifests[].platform | "\(.os)/\(.architecture)"] | sort) == ["linux/amd64", "linux/arm64"]
              and .annotations["org.opencontainers.image.licenses"] == "MIT"' <<<"$index" >/dev/null ||
              { echo "FAIL: $reference: $index" >&2; exit 1; }
            echo "ok: $reference"
            verified=$((verified + 1))
          done
          # Every image the release publishes, and none missed.
          [[ ${#images[@]} -eq 8 && $verified -eq ${#images[@]} ]] ||
            { echo "FAIL: $verified of ${#images[@]} images verified, of 8" >&2; exit 1; }

  # Each library's acceptance tests, against its reference application (stackr RFC-0003's phase 5,
  # lattice ADR-0015): its `api` task starts docplan or oncall from the package's compose.yaml,
  # runs the package's Bruno collection and Schemathesis over its committed OpenAPI document, and
  # stops it. It runs when the library, its application or the tools change.
  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      # scripts/api installs Schemathesis itself, with `uv run --group acceptance`, only when a
      # library is affected.
      - run: bun install --frozen-lockfile
      - run: uv run --no-project python scripts/affected.py api
      # app's and admin's scenarios, through playwright-bdd in Chromium, against portalr's test
      # application with Supabase Auth (portalr ADR-0013, ADR-0023); ui's one task installs
      # Chromium for both.
      - run: uv run --no-project python scripts/affected.py bdd
      # Schemathesis's JUnit report for each library, to read what failed.
      - name: Upload the reports
        if: failure() && hashFiles('.api-reports/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-reports
          path: .api-reports/
          retention-days: 7
      # Playwright's traces of app's and admin's failed scenarios, to step through what they saw.
      - name: Upload the scenarios' traces
        if: failure() && hashFiles('packages/portalr/web/*/test-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bdd-traces
          path: packages/portalr/web/*/test-results/
          retention-days: 7

  # stackr's AWS recipe, tier 1 (stackr RFC-0004): OpenTofu, TFLint, checkov, and the modules'
  # tests against a mocked AWS. Never AWS, and no Floci: tier 2 starts Floci.
  aws:
    name: AWS (tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      # OpenTofu's and TFLint's plugins are lattice's own, which proto loads from a trusted file.
      - run: proto trust .prototools && proto install tofu && proto install tflint
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: opentofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/stackr/deploy/aws/**/.terraform.lock.hcl') }}
      # TFLint fetches its AWS ruleset from GitHub's API, which limits requests without a token.
      - run: uv run --no-project python scripts/affected.py aws
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Whether a pull request changes tier 2's inputs: the recipe, the images' files, or the template
  # it generates the application from. Asked on a small runner, so an unaffected pull request
  # starts no arm64 one.
  aws-tier2-affected:
    name: AWS (tier 2) affected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - id: affected
        shell: bash
        run: |
          # moon's answer first, on its own: if moon fails, so does this, rather than skipping.
          echo "Comparing $MOON_HEAD with $MOON_BASE: $(git diff --name-only "$MOON_BASE...$MOON_HEAD" | wc -l) files changed"
          affected=$(moon query tasks --affected --id aws-tier2)
          # An answer of moon's shape, or fail: a malformed one isn't "not affected".
          jq --exit-status '.tasks | type == "object"' <<<"$affected" >/dev/null
          if jq --exit-status '.tasks.stackr["aws-tier2"]' <<<"$affected" >/dev/null; then
            echo "affected=true" >>"$GITHUB_OUTPUT"
            echo "stackr:aws-tier2 is affected"
          else
            echo "stackr:aws-tier2 isn't affected"
          fi

  # stackr's AWS recipe, tier 2 (stackr RFC-0004, ADR-0036): envs/floci applied against Floci,
  # with the thin images and an application from the template, smoked and destroyed, when the
  # job above finds its inputs changed. On arm64, as Fargate runs the tasks. What it starts is
  # published on the runner's 127.0.0.1 alone, and it never reaches AWS.
  aws-tier2:
    name: AWS (tier 2)
    needs: aws-tier2-affected
    if: needs.aws-tier2-affected.outputs.affected == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The whole history: moon compares with the pull request's base, as MOON_BASE names it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: proto trust .prototools && proto install tofu
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: opentofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/stackr/deploy/aws/**/.terraform.lock.hcl') }}
      - run: moon run stackr:aws-tier2

  # Each variant of the application template, generated and checked as its own CI would: lint,
  # strict types, and the tests with 100% coverage. It installs the libraries from the checkout, so
  # it runs when stackr or a library changes, and checks the two together (stackr ADR-0018). The
  # matrix values aren't the task's inputs: moon counts a variable that is set as a change.
  template:
    name: Template (${{ matrix.libraries }}${{ matrix.evals && ', evals' || '' }}${{ matrix.access == 'none' && ', no access' || '' }}${{ matrix.bridge == 'false' && ', no bridge' || '' }}${{ matrix.portal == 'false' && ', no portal' || '' }}${{ matrix.ui == 'false' && ', no ui' || '' }}${{ matrix.tracker && matrix.tracker != 'none' && format(', {0}', matrix.tracker) || '' }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        libraries: [artifactr, reflexr, both]
        evals: [true, false]
        python: ["3.12"]
        access: [grantr]
        # Set so the rows without the bridge, the portal or the forms, or with a tracker, are jobs
        # of their own, not merged into their twins.
        bridge: ["true"]
        portal: ["true"]
        tracker: [none]
        ui: ["true"]
        include:
          - libraries: both
            evals: true
            python: "3.14"
            access: grantr
          - libraries: both
            evals: true
            python: "3.12"
            access: none
          - libraries: both
            evals: true
            python: "3.12"
            access: grantr
            bridge: "false"
          - libraries: both
            evals: true
            python: "3.12"
            access: grantr
            portal: "false"
          - libraries: both
            evals: true
            python: "3.12"
            access: grantr
            tracker: plane
          - libraries: both
            evals: true
            python: "3.12"
            access: none
            tracker: vikunja
          - libraries: both
            evals: true
            python: "3.12"
            access: grantr
            ui: "false"
    env:
      TEMPLATE_LIBRARIES: ${{ matrix.libraries }}
      TEMPLATE_EVALS: ${{ matrix.evals }}
      TEMPLATE_PYTHON: ${{ matrix.python }}
      TEMPLATE_ACCESS: ${{ matrix.access }}
      TEMPLATE_BRIDGE: ${{ matrix.bridge || 'true' }}
      TEMPLATE_PORTAL: ${{ matrix.portal || 'true' }}
      TEMPLATE_TRACKER: ${{ matrix.tracker || 'none' }}
      TEMPLATE_UI: ${{ matrix.ui || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: uv sync --locked --all-packages --all-groups --all-extras
      - run: uv run --no-project python scripts/affected.py template

  # The stack, started with each set of profiles, and telemetry sent through it, when stackr or a
  # library changes: the stack shows the libraries' dashboards, and its application runs the pull
  # request's libraries, from its merge commit.
  smoke:
    name: Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: observability
            profiles: observability
            database: supabase
          - name: everything on local Supabase, and an application
            profiles: observability langfuse gateway
            database: supabase
            app: true
          - name: everything on PostgreSQL
            profiles: observability langfuse gateway
            database: postgres
          # stackr RFC-0004's single host: behind Caddy, with its own CA, on PostgreSQL with
          # GoTrue, and an application from the template's hosting: host.
          - name: a single host, behind Caddy, and an application
            profiles: observability langfuse gateway auth
            database: postgres
            recipe: host
            app: true
    env:
      PROFILES: ${{ matrix.profiles }}
      STACKR_DATABASE: ${{ matrix.database }}
      STACKR_RECIPE: ${{ matrix.recipe || 'local' }}
      # The portal's own scenarios, in Chromium, against the application, on local Supabase
      # (portalr ADR-0040).
      SMOKE_SCENARIOS: ${{ matrix.app && matrix.database == 'supabase' && 'true' || '' }}
      # The single host's settings, which its bootstrap would write to .env; empty elsewhere.
      STACKR_DOMAIN: ${{ matrix.recipe == 'host' && 'stackr.test' || '' }}
      CADDY_TLS: ${{ matrix.recipe == 'host' && 'tls internal' || '' }}
      AUTH_PUBLIC_URL: ${{ matrix.recipe == 'host' && 'https://auth.stackr.test' || '' }}
      AUTH_SITE_URL: ${{ matrix.recipe == 'host' && 'https://app.stackr.test' || '' }}
      # Its backups' bucket: a MinIO of the job's own, over HTTPS, since pgBackRest speaks only
      # HTTPS to S3, with a certificate the job makes, which pgBackRest and ClickHouse check
      # (stackr ADR-0027).
      BACKUP_S3_ENDPOINT: ${{ matrix.recipe == 'host' && 'backups' || '' }}
      BACKUP_S3_PORT: ${{ matrix.recipe == 'host' && '9000' || '' }}
      BACKUP_S3_BUCKET: ${{ matrix.recipe == 'host' && 'stackr-backups' || '' }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ matrix.recipe == 'host' && 'stackr-backups' || '' }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ matrix.recipe == 'host' && 'stackr-backups-in-ci' || '' }}
      BACKUP_S3_CA_FILE: ${{ matrix.recipe == 'host' && '/tmp/stackr-backups/public.crt' || '' }}
      # Local Supabase without the services the smoke test doesn't use.
      SUPABASE_START_FLAGS: >-
        -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,storage-api,postgrest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint rejects `$/`
      - run: uv sync --locked --all-packages --all-groups --all-extras
      - name: Read versions.env
        run: grep -E '^[A-Z_]+=' packages/stackr/versions.env >> "$GITHUB_ENV"
      # The scenarios' packages and Chromium, installed before the Supabase CLI's step: after that
      # action an older Bun is first on the PATH, and it can't read bun.lock, so the install must
      # use the toolchain's. They come before the stack's containers do, never while they do:
      # Chromium fails its requests in flight when a network interface comes or goes (lattice
      # ADR-0002, #172), and the smoke test starts nothing while it runs.
      - if: env.SMOKE_SCENARIOS == 'true'
        run: bun install --frozen-lockfile
      - if: env.SMOKE_SCENARIOS == 'true'
        run: moon run ui:chromium
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: matrix.database == 'supabase' && matrix.profiles != 'observability'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # The bucket's certificate, before `make up` mounts it.
      - if: matrix.recipe == 'host'
        name: The backups' bucket's certificate
        run: |
          mkdir -p /tmp/stackr-backups
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=backups -addext subjectAltName=DNS:backups \
            -keyout /tmp/stackr-backups/private.key -out /tmp/stackr-backups/public.crt
          chmod 644 /tmp/stackr-backups/private.key
      # Fails before the job's 30 minutes, so the Logs step below runs and shows where it stood.
      - run: uv run --no-project python scripts/affected.py smoke
        timeout-minutes: 15
      # An application from the template, beside the whole stack (stackr ADR-0011).
      - if: matrix.app
        run: uv run --no-project python scripts/affected.py smoke-app
      # A single host's backups, to the job's own MinIO, and the restore drill (RFC-0004),
      # when the steps above started the stack.
      - if: matrix.recipe == 'host' && hashFiles('packages/stackr/.env') != ''
        name: Back up, and run the restore drill
        working-directory: packages/stackr
        shell: bash
        run: |
          minio=$(docker compose --profile langfuse config --format json | jq -r .services.minio.image)
          docker run -d --name backups --network stackr -v /tmp/stackr-backups:/certs:ro \
            -e MINIO_ROOT_USER="$BACKUP_S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$BACKUP_S3_SECRET_ACCESS_KEY" \
            "$minio" server --certs-dir /certs --address :9000 /data
          # The job's own test keys, for mc inside the container.
          mc=(docker exec -e MC_HOST_backups="https://$BACKUP_S3_ACCESS_KEY_ID:$BACKUP_S3_SECRET_ACCESS_KEY@localhost:9000" backups mc)
          for _ in $(seq 1 30); do "${mc[@]}" ready backups --insecure >/dev/null 2>&1 && break; sleep 2; done
          "${mc[@]}" mb --insecure "backups/$BACKUP_S3_BUCKET"
          make backup restore-drill
          make smoke PROFILES=drill
      # Playwright's traces of the portal's failed scenarios, to step through what they saw.
      - name: Upload the scenarios' traces
        if: failure() && hashFiles('packages/portalr/web/*/test-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-bdd-traces
          path: packages/portalr/web/*/test-results/
          retention-days: 7
      - name: Logs
        if: failure() && hashFiles('packages/stackr/.env') != ''
        working-directory: packages/stackr
        run: |
          docker ps -a
          files=()
          if [[ $STACKR_RECIPE == host ]]; then files=(-f compose.yaml -f deploy/host/compose.prod.yaml); fi
          docker compose "${files[@]}" --profile '*' ps --all
          docker compose "${files[@]}" --profile '*' logs --no-color --tail=200
          if docker inspect backups >/dev/null 2>&1; then docker logs --tail=200 backups; fi
      - name: Stop the stack
        if: always() && hashFiles('packages/stackr/.env') != ''
        working-directory: packages/stackr
        run: |
          docker rm -f backups >/dev/null 2>&1 || true
          make reset

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # GitHub's dependency graph doesn't read uv.lock or bun.lock, so osv-scanner compares the pull
  # request's lockfiles with its base's. It finds every lockfile git doesn't ignore, uv.lock and
  # bun.lock, on either side, even one the pull request adds.
  osv:
    name: OSV
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./

  ci:
    name: CI
    if: always()
    needs: [check, tests, images, specs, thin-images, gotrue, release-images, release-images-publish, acceptance, aws, aws-tier2-affected, aws-tier2, template, smoke, dependency-review, osv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # Each runs only when its inputs changed.
          allowed-skips: release-images-publish, aws-tier2
          jobs: ${{ toJSON(needs) }}
