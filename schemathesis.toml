# Schemathesis, as the `api` tasks run it (scripts/api, lattice ADR-0015). A server error, and every
# check not turned off here, fails.

[generation]
# The libraries refuse a NUL character in any string as `validation_failed` (#67), which the
# document doesn't say of every string, so a NUL would fail `positive_data_acceptance`.
allow-x00 = false

[checks]
# Starlette's 405 names only the first matching route's methods in `Allow`.
allow_header_conformance.enabled = false

# A command's body can be well formed and still not apply: an artifact's data is checked against
# its type, and a stored rule against the workspace's events, actions and limits.
[[operations]]
include-method = "POST"
include-path-regex = "/commands$"
checks.positive_data_acceptance.enabled = false

# `limit` and `last` exclude each other, which OpenAPI's parameters can't say, and reflexr's `type`
# is checked as an event name, with a hint for a name without a namespace, rather than by a
# pattern in the document.
[[operations]]
include-method = "GET"
include-path-regex = "/events$"
checks.positive_data_acceptance.enabled = false

# These take string ids in their query, and a value Schemathesis means as a boolean or a number,
# such as `true`, is a valid string id.
[[operations]]
include-method = "GET"
include-path-regex = "/(workspaces|artifacts|events|runs|dead-letters)$"
checks.negative_data_rejection.enabled = false

# portalr's reads name their tenant with X-Tenant, which a caller bound to no tenant must send
# though the document can't require it; scripts/api calls as acme's owner.
[[operations]]
include-path-regex = "^/portalr/v1/(traces|logs|metrics|scores|spend|invites)"
headers = { "X-Tenant" = "acme" }

# The deployment's reads are an operator's, which acme's owner isn't.
[[operations]]
include-path-regex = "^/portalr/v1/deployment/"
checks.positive_data_acceptance.enabled = false

# A diagram's image is uploaded as its raw bytes, a PNG or a JPEG, which Schemathesis has no
# serializer for and couldn't make valid if it had: artifactr's tests check every refusal of it
# (tests/excalidraw/test_images.py). Its read is still tested here.
[[operations]]
include-method = "POST"
include-path-regex = "/diagrams/\\{artifact_id\\}/images$"
enabled = false
