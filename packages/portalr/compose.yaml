# portalr's acceptance stack (lattice ADR-0015): its test application, and the tools its readers
# read, as stackr runs them, with stackr's own configurations. Langfuse and LiteLLM aren't here:
# their reads are unavailable (portalr ADR-0011). `moon run portalr:api` runs it. With the `bdd`
# profile, Supabase Auth (GoTrue, alone) and its database come too, for the UIs' scenarios
# (`moon run app:bdd`, portalr ADR-0013).
#
# Ports are the system's to pick, which the scripts read back.

name: portalr

services:
  app:
    profiles: [app]
    build:
      # lattice's root, which holds the one uv.lock.
      context: ../..
      dockerfile: packages/portalr/tests/app/Dockerfile
    ports:
      - "127.0.0.1::8000"
    environment:
      PORTALR_JWT_SECRET: &secret portalr-test-only-jwt-secret-not-for-use
      PORTALR_GOTRUE_URL: http://gotrue:9999
    # Loki's image has no shell or probe of its own, so the application's check waits for it too.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          for url in ("http://127.0.0.1:8000/portalr/config.json", "http://loki:3100/ready"):
              urllib.request.urlopen(url)
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      prom-label-proxy:
        condition: service_healthy

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../stackr/deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1::3200"
      - "127.0.0.1::4318"
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      prometheus:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - ../stackr/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1::9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 60

  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.15.1
    command:
      - -label=tenant_id
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
      - -internal-listen-address=127.0.0.1:8081
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/metrics"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../stackr/deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1::3100"

  # Supabase Auth, as local Supabase runs it, without the rest of Supabase: the test application
  # serves it at /auth/v1. It signs HS256 tokens with the secret the application verifies.
  gotrue:
    profiles: [bdd]
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:auth@auth-db:5432/postgres
      # Where people reach it: through the test application, at /auth/v1.
      API_EXTERNAL_URL: http://localhost/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_SITE_URL: http://localhost
      GOTRUE_JWT_SECRET: *secret
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    # Its migrations have run once it answers.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    profiles: [bdd]
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: auth
    volumes:
      - ./tests/app/auth.sql:/docker-entrypoint-initdb.d/auth.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
