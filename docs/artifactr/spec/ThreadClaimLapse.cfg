\* A pull request's run: safety when a claim lapses while its holder lives, as across a stall or a
\* clock that runs ahead. With no fault or crash, which ThreadClaim.cfg adds at a cost too great
\* to pay beside a lapse.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    MaxLog = 2
    MaxReq = 1
    MaxPauses = 1
    TTL = 1
    MaxCrashes = 0
    MaxFaults = 0
    Stalls = TRUE
    Retries = FALSE
INVARIANTS
    TypeOK
    I1_ConsumedAtMostOnce
    I1_NoneSkipped
    I3_OneActiveRun
PROPERTIES
    I2_ConsumedWithItsWrite
    I6_OldestIsTheReply
