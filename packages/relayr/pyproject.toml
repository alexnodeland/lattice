[project]
name = "relayr-ai"
version = "0.3.0"
description = "The bridge between artifactr and reflexr: events from chats and artifacts become events for rules, and runs act back in the chat as proposals and notices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "llm", "events", "rules", "collaboration", "artifacts", "pydantic-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "artifactr-ai>=0.3.0",
    "reflexr>=0.1.0",
    "lattice-core-ai>=0.2.0",
    "pydantic>=2.13",
    "pydantic-ai-slim>=2.53",
    "opentelemetry-api>=1.45",
]

[project.optional-dependencies]
sql = ["lattice-core-ai[sql]>=0.2.0", "sqlalchemy[asyncio]>=2.1", "alembic>=1.20"]
sqlite = ["relayr-ai[sql]", "aiosqlite>=0.22"]
postgres = ["relayr-ai[sql]", "asyncpg>=0.31"]
otel = ["lattice-core-ai>=0.2.0", "opentelemetry-sdk>=1.45"]
evals = ["evalr>=0.1.0"]
plane = ["httpx>=0.28"]
vikunja = ["httpx>=0.28"]
fastapi = ["lattice-core-ai>=0.2.0", "fastapi>=0.141", "starlette>=0.46.0"]
# ui:form_submitted from artifactr's forms (relayr.ui), for an application that has them.
forms = ["artifactr-ai[forms]>=0.3.0"]
# excalidraw:elements_changed from artifactr's diagrams (relayr.excalidraw), for an application
# that has them.
# The floor is raised at release, with the owner's approval, to the artifactr that has the extra.
excalidraw = ["artifactr-ai[excalidraw]>=0.3.0"]
langfuse = [
    "langfuse>=4.15,<5",
    "artifactr-ai[langfuse]>=0.3.0",
    "reflexr[langfuse]>=0.1.0",
    # The libraries' [langfuse] extras need evalr; named here, it comes from the workspace too.
    "evalr[langfuse]>=0.1.0",
]

[project.urls]
Homepage = "https://lattice.alexnodeland.com/relayr/"
Documentation = "https://lattice.alexnodeland.com/relayr/"
Repository = "https://github.com/alexnodeland/lattice"
Issues = "https://github.com/alexnodeland/lattice/issues"
Changelog = "https://github.com/alexnodeland/lattice/blob/main/packages/relayr/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "httpx>=0.28",
    "hypothesis>=6.168",
    "fastapi>=0.141",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# In lattice, the libraries and lattice-core are the checkout's. A built wheel keeps the ranges
# in [project] alone.
[tool.uv.sources]
artifactr-ai = { workspace = true }
evalr = { workspace = true }
lattice-core-ai = { workspace = true }
reflexr = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Distributed as relayr-ai; imported as relayr.
[tool.uv.build-backend]
module-name = "relayr"

# ─── dependencies ─────────────────────────────────────────────────────────────

# deptry can't tell from the workspace's editable install which module a distribution named
# apart from its module provides.
[tool.deptry.package_module_name_map]
artifactr-ai = "artifactr"
lattice-core-ai = "lattice_core"

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A test that runs for a minute is stuck: fail it with its stack, as a failure of its own, by
# SIGALRM, so the xdist worker running it carries on (lattice ADR-0007, ADR-0028).
timeout = 60
timeout_method = "signal"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "postgres: needs a PostgreSQL database (set RELAYR_TEST_POSTGRES_URL)",
]

[tool.coverage.run]
branch = true
source = ["src/relayr"]
# SQLAlchemy runs run_sync callables in a greenlet, which coverage follows only when told.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
