# lattice, the root-level project: lattice's own tests, lint and types for the root's Python,
# the site, and knip over the Bun workspace. It inherits none of the projects' tasks, which would
# check every package again.
# Python, though it holds the root's TypeScript tooling too: its tests are the root's pytest, which
# scripts/affected.py's --language python must reach.
language: 'python'

workspace:
  inheritedTasks:
    include: []

fileGroups:
  python:
    - 'scripts/**/*'
    - 'tests/**/*'

tasks:
  lint:
    description: "Check the root's Python for formatting and lint rules"
    script: 'uv run ruff format --check scripts tests && uv run ruff check scripts tests'
    inputs:
      - '@group(python)'
      - 'pyproject.toml'
      - 'uv.lock'

  typecheck:
    description: "Type-check the root's Python with pyright"
    command: 'uv run pyright'
    inputs:
      - '@group(python)'
      - 'pyproject.toml'
      - 'uv.lock'

  # The quality test reads every package's Python and portalr's TypeScript, the edges test every
  # project's configuration, the specs' tests read each formal spec and run scripts/tlc, and
  # scripts/craft's run it.
  test:
    description: "Run lattice's tests"
    command: 'uv run pytest --durations=10'
    inputs:
      - '**/*.py'
      - 'packages/*/scripts/*'
      - '**/pyproject.toml'
      - '**/moon.yml'
      - '.moon/workspace.yml'
      - 'uv.lock'
      - 'packages/portalr/web/*/src/**/*'
      - 'packages/portalr/web/*/*.{json,ts,yml}'
      # The parity test reads every library's OpenAPI document.
      - 'packages/*/schemas/*.openapi.json'
      - 'docs/*/spec/**/*'
      # The typefaces' notices, which test_font_notices.py holds to each other and to the font.
      - 'packages/stackr/workers/diagrams/FONTS.txt'
      - 'packages/portalr/web/ui/licenses/*'
      - 'packages/portalr/web/ui/fonts/*'
      - 'scripts/tlc'
      - 'scripts/tlc.sha256'
      - 'scripts/craft'
      - 'scripts/crafts/*'
      # Nightly's fidelity job, held to the packages each app's worker image installs.
      - '.github/workflows/nightly.yml'
      - 'packages/stackr/copier.yml'

  docs:
    description: 'Build the documentation site in strict mode, and check that its lists rendered'
    script: 'uv run zensical build --strict --clean && uv run python scripts/check_site.py site'
    inputs:
      - 'mkdocs.yml'
      - 'docs/**/*'
      - 'scripts/**/*'
      - 'packages/*/src/**/*'
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/schemas/**/*'
      - 'packages/stackr/**/*'
      - '*.md'
      - 'LICENSE'
      - 'uv.lock'

  docs-serve:
    description: 'Serve the documentation site with live reload at http://localhost:8000'
    command: 'uv run zensical serve'
    preset: 'server'

  # Not part of check: the Title check runs it, with the pull request's title and description.
  breaks:
    description: "Find the breaks the branch adds to the packages' public APIs, against their last releases"
    command: 'uv run python scripts/breaks.py origin/main'
    options:
      cache: false
      runInCI: false

  workflows:
    description: 'Lint the workflows and actions with actionlint and zizmor'
    script: 'uv run actionlint && uv run zizmor --quiet .github'
    inputs:
      - '.github/workflows/**/*'
      - '.github/actions/**/*'
      - 'uv.lock'

  # One knip run over the Bun workspace: unused files, exports and dependencies in every web
  # package, and the tools moon's tasks run.
  knip:
    description: 'Find unused files, exports and dependencies in the web packages with knip'
    command: 'bun x --bun --no-install knip'
    inputs:
      - 'packages/portalr/web/*/src/**/*'
      - 'packages/portalr/web/*/*.{json,ts,yml}'
      - '.moon/tasks/*.yml'
      - 'moon.yml'
      - 'knip.json'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'

  # scripts/dev against fakes: what `make dev` runs and refuses, starting nothing.
  check-dev:
    description: "Check scripts/dev, which `make dev` runs, against fakes"
    command: 'scripts/check-dev'
    inputs:
      - 'scripts/dev'
      - 'scripts/check-dev'
      - 'packages/stackr/copier.yml'

  check:
    description: "Run the root's checks, as CI does"
    command: 'noop'
    deps:
      - 'lint'
      - 'check-dev'
      - 'typecheck'
      - 'test'
      - 'docs'
      - 'workflows'
      - 'knip'
