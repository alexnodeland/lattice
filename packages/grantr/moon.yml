# grantr: identity and access for artifactr, reflexr and portalr. It imports neither, nor any sibling but
# lattice-core.
language: 'python'
layer: 'library'
tags: ['distribution']
dependsOn:
  - 'lattice-core'

tasks:
  test:
    # A worker for each of the runner's cores, sharing nothing (lattice ADR-0010).
    args: ['--numprocesses', 'auto']

  schema:
    description: "Regenerate the admin API's OpenAPI document from the router, and the catalog of grantr's commands"
    script: >-
      uv run python $workspaceRoot/scripts/generate.py schemas/grantr.openapi.json grantr.fastapi.openapi
      && uv run python $workspaceRoot/scripts/generate.py schemas/grantr.commands.json grantr.commands.schema
    options:
      cache: false
      runInCI: false

  pg-up:
    description: 'Start PostgreSQL for the SQL tests, from compose.yaml, as a compose project of its own on a port the system picks'
    command: '$workspaceRoot/scripts/pg up'
    options:
      cache: false
      runInCI: false

  pg-down:
    description: 'Stop PostgreSQL'
    command: '$workspaceRoot/scripts/pg down'
    options:
      cache: false
      runInCI: false

  # $GRANTR_TEST_POSTGRES_URL isn't an input: moon counts a variable that is set as a change, and CI
  # always sets it, so every pull request would run these tests. CI never restores moon's cache;
  # locally, `moon run grantr:test --force` runs the PostgreSQL tests past a cached run without
  # them.
  test-pg:
    description: 'Run the tests on PostgreSQL as well as SQLite (after pg-up)'
    script: 'url=$($workspaceRoot/scripts/pg url) && GRANTR_TEST_POSTGRES_URL=$url uv run pytest --cov --cov-report=term-missing --durations=10'
    options:
      cache: false
      runInCI: false
