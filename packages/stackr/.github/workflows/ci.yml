name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # Generates a throwaway .env first, which also tests scripts/setup-env.
      - run: make validate

  smoke:
    name: Smoke (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: observability
            profiles: observability
            database: supabase
          - name: everything on local Supabase
            profiles: observability langfuse gateway
            database: supabase
          - name: everything on PostgreSQL
            profiles: observability langfuse gateway
            database: postgres
    env:
      PROFILES: ${{ matrix.profiles }}
      STACKR_DATABASE: ${{ matrix.database }}
      # Local Supabase without the services the smoke test doesn't use.
      SUPABASE_START_FLAGS: >-
        -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,storage-api,postgrest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Read versions.env
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v3
        if: matrix.database == 'supabase' && matrix.profiles != 'observability'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: make env
      - run: make up
      - run: make smoke
      - name: Logs
        if: failure()
        run: |
          docker ps -a
          docker compose --profile '*' logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: make reset
