# The contributor stack: PostgreSQL for artifactr-files' SQL tests, and nothing else.
#
#   docker compose up -d --wait              (moon run artifactr-files:pg-up)

name: artifactr-files

services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_PASSWORD: artifactr-files
    ports:
      - "127.0.0.1:${ARTIFACTR_FILES_PG_PORT:-54333}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
