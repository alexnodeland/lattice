# The merge queue (lattice ADR-0016, amended by ADR-0024). A pull request labelled `queue`, or
# queued with `@mergifyio queue`, is tested together with the others waiting, in temporary draft
# pull requests that hold the batch, and squash-merged when its batch passes.
#
# - Up to two checks run at once (`max_parallel_checks`), and a batch holds one to five pull
#   requests (`batch_size`), waiting at most three minutes for a batch to fill
#   (`batch_max_wait_time`). A `CI` run is up to 41 jobs and the runners are 20 at once, so three
#   drafts of one pull request each starve one another. Mergify keeps batches at the minimum
#   while the parallel checks can drain the queue, and grows them toward the maximum when it
#   backs up, which is when sharing a draft saves the most. A lone pull request meets the minimum
#   of one, so it is expected not to wait for the window. A minimum of two would make a burst one
#   draft sooner, but the docs don't say what a lone pull request does below it: try it after
#   watching real batches. To roll back, restore `batch_size.min`, `batch_max_wait_time` and
#   `max_parallel_checks` to 1, 30 seconds and 3 (ADR-0024).
# - What a batch must pass is `CI`, on its draft pull request (`merge_conditions`). The ruleset's
#   required checks, `CI` and `Title`, are also required of each pull request itself to enter the
#   queue. `Title` runs on the draft pull requests too, and concludes success without checking
#   them, whose titles are Mergify's own (title.yml); the squash commit's title and body come from
#   each original pull request (`commit_message_format`).
# - A batch that fails is split and tested again, into `max_parallel_checks` parts each time,
#   until the pull request that broke it is found and taken out of the queue, with a comment
#   saying so; the others go on. `batch_max_failure_resolution_attempts` caps the splitting: a
#   batch of five split in two parts each time needs at most ceil(log2(5)) = 3 rounds (the docs
#   don't define a round precisely), so the cap of 3 is enough.
#   Two pull requests that conflict in one batch are taken out with a comment: the draft branch
#   can't be made, so there is nothing to split.
# - A failed check is retried once before anything is dequeued (`max_checks_retries: 1`, ADR-0024's
#   2026-10-30 retry amendment): Mergify recreates the draft and runs `CI` again, so a flake costs
#   one more run instead of a dequeue and a `@mergifyio requeue`. A real failure also runs twice
#   before the splitting above finds it. The schema says a value above 0 always uses a draft pull
#   request, which the queue does already. To roll back, remove the setting (default 0).
# - This needs the ruleset not to require branches to be up to date
#   (`strict_required_status_checks_policy: false`): a pull request's checks are those of the batch
#   it is in, not of its own head against the `main` of the moment.
#
# Release pull requests skip the wait (ADR-0024's 2026-10-30 amendment). release-please's pull
# request (author the lattice GitHub App, `alexnodeland-lattice[bot]`; branch
# `release-please--branches--main...`; title `chore: release main`, or `chore(main): release ...`
# from one a package) gets the `queue` label from the rule at the end, but only once its own `CI`
# and `Title` have passed, so it enters the queue as any pull request does, and its batch must
# still pass `CI` (`merge_conditions`). Renovate is the same App: the branch and title tell them
# apart. In the queue it goes first (`priority_rules`), so it is in the next batch to be checked.
# Nothing here bypasses a check or the ruleset.
queue_rules:
  - name: default
    batch_size:
      min: 1
      max: 5
    batch_max_wait_time: 3 minutes
    batch_max_failure_resolution_attempts: 3
    max_checks_retries: 1
    # Not `auto`, which Mergify computes from this queue's recent CI runtime (its 95th percentile
    # and a margin it doesn't state): a draft waiting for runners ran 31 minutes at the median and
    # 56 at the longest, and a batch of five can run longer. Tier 2's gate and job can take 80
    # between them, so 90. Drop it for `auto` once the queue has history under these settings.
    checks_timeout: 90 minutes
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
    queue_conditions:
      - base = main
      - label = queue
      - -draft
    merge_conditions:
      - check-success = CI

priority_rules:
  - name: release pull requests first
    conditions:
      - author = alexnodeland-lattice[bot]
      - head ~= ^release-please--branches--main
      - "title ~= ^chore(\\(main\\))?: release"
    priority: high

merge_queue:
  max_parallel_checks: 2

merge_protections_settings:
  auto_merge_conditions:
    - label = queue

pull_request_rules:
  - name: queue release-please's pull request once its checks pass
    conditions:
      - base = main
      - author = alexnodeland-lattice[bot]
      - head ~= ^release-please--branches--main
      - "title ~= ^chore(\\(main\\))?: release"
      - -draft
      - check-success = CI
      - check-success = Title
    actions:
      label:
        add: [queue]
