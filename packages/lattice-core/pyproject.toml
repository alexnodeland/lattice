[project]
name = "lattice-core-ai"
version = "0.6.0"
description = "What lattice's packages share and must keep identical."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Nodeland", email = "alex@ournature.studio" }]
requires-python = ">=3.12"
keywords = ["agents", "pydantic", "lattice"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13",
]

[project.optional-dependencies]
sql = ["sqlalchemy[asyncio]>=2.1"]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-asyncpg>=0.66b0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-processor-baggage>=0.66b0",
    "opentelemetry-sdk>=1.45",
    "pydantic-ai-slim>=2.51",
]
# The litellm extra reads Langfuse 4's propagated tags from OpenTelemetry's context by their
# internal key (lattice ADR-0022); the lockfile's langfuse is the version verified.
langfuse = ["langfuse>=4.15,<5", "opentelemetry-sdk>=1.45"]
litellm = ["pydantic-ai-slim[openai]>=2.51", "httpx2>=2.7", "opentelemetry-api>=1.45"]
# The agents bridge offers capabilities as a toolset rebuilt at each run step, and defers a call for
# an approval with ApprovalRequired's metadata, given back as the call resumes.
agents = ["pydantic-ai-slim>=2.53"]

[project.urls]
Homepage = "https://lattice.alexnodeland.com/lattice-core/"
Documentation = "https://lattice.alexnodeland.com/lattice-core/"
Repository = "https://github.com/alexnodeland/lattice"
Issues = "https://github.com/alexnodeland/lattice/issues"
Changelog = "https://github.com/alexnodeland/lattice/blob/main/packages/lattice-core/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "sqlalchemy[asyncio]>=2.1",
    "fastapi>=0.141",
    "httpx>=0.28",
    "hypothesis>=6.168",
]
lint = ["ruff>=0.16", "pyright>=1.1.414"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Distributed as lattice-core-ai, since lattice-core on PyPI is an unrelated project (lattice
# ADR-0018); imported as lattice_core.
[tool.uv.build-backend]
module-name = "lattice_core"

# ─── types ────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"

# ─── tests and coverage ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# A test that runs for a minute is stuck: fail it with its stack, as a failure of its own, by
# SIGALRM, so the xdist worker running it carries on (lattice ADR-0007, ADR-0028).
timeout = 60
timeout_method = "signal"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # backoff, which Langfuse uses, calls asyncio.iscoroutinefunction, deprecated in Python 3.14.
    # As an error, the warning would stop Langfuse's background uploads in the tests; outside
    # them Python ignores it.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff._decorator",
]

[tool.coverage.run]
branch = true
source = ["src/lattice_core"]
# SQLAlchemy runs run_sync callables in a greenlet, which coverage follows only when told.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol.*\\):",
]
