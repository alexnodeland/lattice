# osv-scanner reads this file beside uv.lock, in CI's OSV job and in the nightly scan. Each
# ignore says why it holds and lapses at its date, when it is reviewed again. A GHSA's ignore
# covers the PYSEC and CVE ids that alias it.

[[IgnoredVulns]]
id = "GHSA-4g5m-c9r5-49xf"
ignoreUntil = 2026-12-31
reason = "Local file read through request-supplied OIDC file references, in litellm's proxy server, which lattice never runs: it installs litellm 1.83.0 only as DSPy's SDK. Every litellm after 1.83.0 pins openai<3, which pydantic-ai-slim[openai] (openai>=3.19) can't share."

