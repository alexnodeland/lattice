# checkov over the edge module (RFC-0004), run by deploy/aws/check. Each check it skips here is
# skipped for this module only, with its reason; nothing is skipped inline.
framework:
  - terraform
compact: true
quiet: true
skip-check:
  # TLS ends at the ALB; it reaches the services over HTTP, inside the VPC's private subnets.
  - CKV_AWS_378
  # WAF comes later (RFC-0004).
  - CKV2_AWS_28
